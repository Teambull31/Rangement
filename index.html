<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rangement — Système de Chasse</title>
<meta name="description" content="Ménage gamifié pour deux, style Solo Leveling : quêtes, XP, rangs, duel et récompenses.">
<meta name="theme-color" content="#060A13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rangement">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="supabase.js"></script>
<style>
  :root {
    --abyss: #060A13;
    --panel: #0C1526;
    --panel-2: #101D33;
    --line: #1C3252;
    --line-glow: #2B5A8F;
    --sys: #4DC3FF;
    --sys-dim: #2E7FB8;
    --mana: #8B7BFF;
    --gold: #F0C550;
    --crit: #FF5C6E;
    --high: #FF9D5C;
    --ok: #5CE0A5;
    --ink: #D9E7F7;
    --ink-dim: #8AA3C2;
    --display: 'Orbitron', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--abyss);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77,195,255,.10), transparent),
      radial-gradient(ellipse 60% 40% at 90% 110%, rgba(139,123,255,.07), transparent);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
    padding-bottom: 90px;
  }
  button { font-family: var(--body); cursor: pointer; }
  input, select, textarea { font-family: var(--body); }
  :focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }

  /* ---------- Header ---------- */
  header { text-align: center; padding: 10px 0 4px; }
  .sys-tag {
    display: inline-block;
    font-family: var(--display);
    font-size: 10px; font-weight: 700;
    letter-spacing: .35em;
    color: var(--sys);
    border: 1px solid var(--line-glow);
    padding: 4px 12px 3px 15px;
    border-radius: 2px;
    text-transform: uppercase;
    background: rgba(77,195,255,.06);
  }
  h1 {
    font-family: var(--display);
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-top: 8px;
    background: linear-gradient(180deg, #EAF6FF 30%, var(--sys) 90%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-wrap: balance;
  }
  .week-lead {
    font-size: 14px; color: var(--ink-dim);
    letter-spacing: .06em; margin-top: 2px;
  }
  .week-lead b { color: var(--gold); font-weight: 700; }
  .syncline { font-size: 12px; color: var(--ink-dim); letter-spacing: .08em; margin-top: 4px; text-transform: uppercase; }

  /* ---------- Player cards ---------- */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .hunter {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-top: 2px solid var(--sys-dim);
    border-radius: 4px;
    padding: 12px 12px 14px;
    overflow: hidden;
  }
  .hunter.leader { border-top-color: var(--gold); }
  .hunter .crown { position: absolute; top: 8px; right: 10px; font-size: 15px; }
  .hunter .face { font-size: 30px; line-height: 1; }
  .hunter .name {
    font-weight: 700; font-size: 17px; letter-spacing: .04em; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rankline { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .rank {
    font-family: var(--display); font-weight: 900; font-size: 22px;
    color: var(--mana);
  }
  .rank.s { color: var(--gold); text-shadow: 0 0 12px rgba(240,197,80,.55); }
  .lvl { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--sys); letter-spacing: .1em; }
  .xpbar { height: 7px; background: #0A1120; border: 1px solid var(--line); border-radius: 99px; margin-top: 9px; overflow: hidden; }
  .xpbar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--sys-dim), var(--sys));
    box-shadow: 0 0 8px rgba(77,195,255,.7);
    border-radius: 99px;
    transition: width .5s ease;
  }
  .xpnums { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .streak { color: var(--high); font-weight: 600; }

  /* ---------- Tabs ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: rgba(8,13,24,.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs { max-width: 640px; margin: 0 auto; display: flex; }
  .tabs button {
    flex: 1; background: none; border: none; color: var(--ink-dim);
    font-size: 12px; font-weight: 600; letter-spacing: .05em;
    padding: 9px 2px 11px; text-transform: uppercase;
    border-top: 2px solid transparent;
  }
  .tabs button .ico { display: block; font-size: 19px; margin-bottom: 2px; }
  .tabs button.on { color: var(--sys); border-top-color: var(--sys); }

  /* ---------- Panels / sections ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
  }
  h2 {
    font-family: var(--display); font-size: 13px; font-weight: 700;
    letter-spacing: .25em; text-transform: uppercase; color: var(--sys);
    margin-bottom: 12px;
  }
  h2 small { color: var(--ink-dim); letter-spacing: .1em; font-weight: 500; }
  .hint { font-size: 14px; color: var(--ink-dim); }

  /* ---------- Quest list ---------- */
  .quest {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--pcol, var(--sys-dim));
    border-radius: 3px;
    padding: 11px 12px;
    margin-bottom: 9px;
  }
  .quest.bonus { border-color: var(--gold); border-left-color: var(--gold); background: linear-gradient(90deg, rgba(240,197,80,.08), var(--panel-2) 55%); }
  .quest .qi { font-size: 24px; }
  .quest .qmain { flex: 1; min-width: 0; }
  .quest .qname { font-weight: 700; font-size: 16.5px; letter-spacing: .02em; }
  .qmeta { display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 2px; border: 1px solid var(--pcol, var(--sys-dim));
    color: var(--pcol, var(--sys));
    background: color-mix(in srgb, var(--pcol, #4DC3FF) 14%, transparent);
  }
  .chip.gold { color: var(--gold); border-color: var(--gold); background: rgba(240,197,80,.1); }
  .lastdone { font-size: 12px; color: var(--ink-dim); letter-spacing: .03em; }
  .qbtns { display: flex; gap: 7px; }
  .doer {
    border: 1px solid var(--line-glow); background: rgba(77,195,255,.08);
    color: var(--ink); border-radius: 3px;
    font-size: 20px; width: 44px; height: 44px;
    display: grid; place-items: center;
    transition: transform .1s, background .15s;
  }
  .doer:active { transform: scale(.9); background: rgba(77,195,255,.25); }

  /* ---------- Duel ---------- */
  .vsrow { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; }
  .vsname { font-weight: 700; width: 30%; }
  .vsname.r { text-align: right; }
  .vs {
    font-family: var(--display); font-weight: 900; color: var(--crit);
    font-size: 15px; letter-spacing: .1em;
  }
  .duelbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); background: #0A1120; }
  .duelbar .a { background: linear-gradient(90deg, var(--sys-dim), var(--sys)); transition: width .5s; }
  .duelbar .b { background: linear-gradient(90deg, var(--mana), #6455D6); transition: width .5s; }
  .statgrid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 14px; font-variant-numeric: tabular-nums; }
  .statgrid .l { text-align: right; font-family: var(--display); font-weight: 700; color: var(--sys); }
  .statgrid .c { text-align: center; color: var(--ink-dim); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; align-self: center; }
  .statgrid .r2 { font-family: var(--display); font-weight: 700; color: var(--mana); }
  .winbadge { text-align: center; margin-top: 14px; font-size: 15px; color: var(--gold); font-weight: 600; letter-spacing: .04em; }

  /* ---------- Graphique & hauts faits ---------- */
  .legend { display: flex; gap: 18px; font-size: 13.5px; color: var(--ink-dim); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  .feathead { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; margin: 10px 0 7px; }
  .featgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .feat {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; font-size: 12.5px; color: var(--ink-dim);
    opacity: .38; filter: grayscale(.9);
  }
  .feat.on { opacity: 1; filter: none; border-color: var(--line-glow); color: var(--ink); }
  .feat .fi { font-size: 17px; }
  .feat small { line-height: 1.15; }
  .trophyline { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .trophyline:last-child { border-bottom: none; }
  .trophyline .tw { color: var(--ink-dim); font-size: 13px; flex: 0 0 92px; }
  .trophyline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trophyline .tscore { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--sys); font-variant-numeric: tabular-nums; }
  .themerow { display: flex; gap: 8px; flex-wrap: wrap; }
  .themebtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 3px; padding: 9px 12px; font-size: 14px; font-weight: 600;
  }
  .themebtn i { width: 12px; height: 12px; border-radius: 50%; }
  .themebtn.on { border-color: var(--sys); color: var(--ink); background: rgba(255,255,255,.04); }
  .togglerow { display: flex; align-items: center; gap: 11px; margin-top: 12px; font-size: 14.5px; }
  .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: #0A1120; border: 1px solid var(--line);
    border-radius: 99px; transition: background .15s, border-color .15s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 50%;
    transform: translateY(-50%); background: var(--ink-dim); border-radius: 50%; transition: transform .15s, background .15s;
  }
  .switch input:checked + span { background: rgba(77,195,255,.18); border-color: var(--sys); }
  .switch input:checked + span::before { transform: translate(18px, -50%); background: var(--sys); }
  .switch input:focus-visible + span { outline: 2px solid var(--sys); outline-offset: 2px; }
  .suggested { border-left-color: var(--gold) !important; }
  .suggested .qname::after { content: " 👉"; }
  .betremind {
    display: flex; align-items: center; gap: 8px;
    background: rgba(240,197,80,.08); border: 1px solid var(--gold); border-radius: 3px;
    padding: 9px 12px; margin-bottom: 12px; font-size: 14px; color: var(--ink);
  }
  .betline { font-size: 15px; padding: 4px 0 10px; border-bottom: 1px dashed var(--line); margin-bottom: 8px; }
  .betline:last-child { border-bottom: none; margin-bottom: 0; }
  .betline.hot { border: 1px solid var(--gold); border-radius: 3px; padding: 10px 12px; background: rgba(240,197,80,.07); }
  .splitline { display: flex; align-items: center; gap: 9px; padding: 7px 0 4px; font-size: 14.5px; }
  .splitcounts { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .splitbar { display: flex; height: 5px; border-radius: 99px; overflow: hidden; background: #0A1120; margin-bottom: 9px; }
  .splitbar i { display: block; height: 100%; }
  .panelhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .linkbtn {
    background: none; border: none; color: var(--sys); font-size: 12.5px; font-weight: 700;
    letter-spacing: .04em; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; flex: 0 0 auto;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .tblwrap { overflow-x: auto; }
  .datatable { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .datatable th, .datatable td { text-align: right; padding: 6px 8px; border-bottom: 1px dashed var(--line); }
  .datatable th[scope="row"] { text-align: left; color: var(--ink-dim); font-weight: 500; }
  .datatable thead th { color: var(--sys); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  .datatable thead th:first-child { text-align: left; }
  .evremind {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: rgba(139,123,255,.08); border: 1px solid var(--mana); border-radius: 3px;
    padding: 9px 12px; margin-bottom: 12px; font-size: 14px; color: var(--ink);
  }
  .evremind button { background: none; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; font-size: 12px; padding: 5px 10px; }
  .filterrow { display: flex; gap: 7px; flex-wrap: wrap; }
  .filterbtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 99px; padding: 6px 13px; font-size: 13px; font-weight: 600;
  }
  .filterbtn.on { border-color: var(--sys); color: var(--ink); background: rgba(255,255,255,.04); }
  .notifhist { margin: 10px 0 4px; }
  .notifhistline {
    display: flex; align-items: center; gap: 8px; padding: 5px 0;
    border-bottom: 1px dashed var(--line); font-size: 13px; color: var(--ink-dim);
  }
  .notifhistline:last-child { border-bottom: none; }
  .notifhistline .hint { font-size: 12px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

  /* ---------- Objectives ---------- */
  .obj { border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); padding: 12px; margin-bottom: 10px; }
  .obj .oname { font-weight: 700; font-size: 16.5px; }
  .obj .oreward { font-size: 14px; color: var(--gold); margin-top: 1px; }
  .obj .obar { height: 9px; background: #0A1120; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-top: 9px; }
  .obj .obar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mana), var(--sys)); border-radius: 99px; transition: width .5s; }
  .obj .onums { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .obj.done { border-color: var(--gold); }
  .claim {
    width: 100%; margin-top: 10px;
    background: linear-gradient(180deg, #F5D77A, var(--gold));
    color: #201800; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    border: none; border-radius: 3px; padding: 10px;
  }
  .wonline { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .wonline:last-child { border-bottom: none; }
  .wonline .d { color: var(--ink-dim); font-size: 13px; }

  /* ---------- Journal ---------- */
  .day-h { font-family: var(--display); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); margin: 14px 0 6px; }
  .logline { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-size: 15.5px; }
  .logline:last-child { border-bottom: none; }
  .logline .lxp { margin-left: auto; font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--sys); white-space: nowrap; }
  .undo { background: none; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; font-size: 13px; padding: 7px 12px; }

  /* ---------- Forms ---------- */
  .frow { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .frow > * { flex: 1; }
  input[type=text], input[type=number], select {
    background: #0A1120; border: 1px solid var(--line); color: var(--ink);
    border-radius: 3px; padding: 9px 10px; font-size: 16px; min-width: 0;
  }
  .btn {
    background: rgba(77,195,255,.12); border: 1px solid var(--line-glow); color: var(--sys);
    border-radius: 3px; padding: 9px 14px; font-weight: 700; font-size: 14px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .btn.ghost { background: none; color: var(--ink-dim); border-color: var(--line); }
  .btn.danger { color: var(--crit); border-color: #5A2430; background: rgba(255,92,110,.08); }
  .mgline { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .mgline:last-child { border-bottom: none; }
  .mgline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { background: none; border: none; color: var(--crit); font-size: 17px; padding: 2px 6px; }

  /* ---------- System notification modal ---------- */
  .veil {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(3,6,12,.75); backdrop-filter: blur(3px);
    display: grid; place-items: center; padding: 24px;
  }
  .sysbox {
    width: 100%; max-width: 380px;
    background: linear-gradient(180deg, #0E1B30, #0A1322);
    border: 1px solid var(--sys);
    box-shadow: 0 0 30px rgba(77,195,255,.35), inset 0 0 25px rgba(77,195,255,.06);
    border-radius: 3px;
    padding: 22px 20px 20px;
    text-align: center;
    animation: sysin .35s ease;
  }
  @keyframes sysin { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sysbox .bang {
    font-family: var(--display); font-weight: 900; letter-spacing: .3em;
    color: var(--sys); font-size: 12px; text-transform: uppercase;
  }
  .sysbox .bang::before, .sysbox .bang::after { content: " ‼ "; color: var(--crit); }
  .sysbox .big { font-family: var(--display); font-weight: 900; font-size: 26px; margin: 12px 0 4px; letter-spacing: .06em; }
  .sysbox .sub { color: var(--ink-dim); font-size: 15px; }
  .sysbox .gold { color: var(--gold); }
  .sysbox button { margin-top: 16px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: #0E1B30; border: 1px solid var(--sys-dim); color: var(--ink);
    padding: 8px 16px; border-radius: 3px; font-size: 15px; z-index: 60;
    box-shadow: 0 0 14px rgba(77,195,255,.3);
    animation: toastin .25s ease;
    white-space: nowrap;
    display: flex; align-items: center; gap: 12px;
  }
  .toast-action {
    background: none; border: 1px solid var(--line-glow); color: var(--sys);
    border-radius: 3px; font-size: 13px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 3px 10px;
  }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (min-width: 560px) { .quest .qname { font-size: 17.5px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sys-tag">Système</span>
    <h1>Rangement</h1>
    <div class="week-lead" id="weekLead"></div>
    <div class="syncline" id="sync"></div>
  </header>

  <div class="duo" id="duo"></div>

  <main id="view"></main>
</div>

<nav>
  <div class="tabs" id="tabs"></div>
</nav>

<div id="modal"></div>
<div id="toastZone" aria-live="polite"></div>

<script>
"use strict";

/* ================= State ================= */
const KEY = "rangement-sl-v2";
const PRIOS = {
  basse:    { label: "Basse",    xp: 10, col: "#8AA3C2" },
  normale:  { label: "Normale",  xp: 20, col: "#4DC3FF" },
  haute:    { label: "Haute",    xp: 35, col: "#FF9D5C" },

/* --- file d'actions : envoyées tout de suite si possible, sinon plus tard --- */
let FLUSHING = false;
function queueOp(op) { PENDING.push(op); save(); flushOps(); renderSync(); }
async function flushOps() {
  if (!sb || FLUSHING) return;
  FLUSHING = true;
  while (PENDING.length) {
    const op = PENDING[0];
    try {
      let res;
      if (op.type === "upsert") res = await sb.from(op.table).upsert(op.row);
      else if (op.type === "delete") res = await sb.from(op.table).delete().eq("id", op.id);
      else if (op.type === "clear") res = await sb.from(op.table).delete().neq("id", "");
      if (res && res.error) throw res.error;
      PENDING.shift(); save();
    } catch (e) { break; /* hors ligne : on réessaiera */ }
  }
  FLUSHING = false;
  renderSync();
}
function applyPending(state) {
  for (const op of PENDING) {
    const coll = state[op.table];
    if (!coll) continue;
    if (op.type === "upsert") {
      const item = fromRow[op.table](op.row);
      const i = coll.findIndex(x => x.id === item.id);
      if (i >= 0) coll[i] = item; else coll.push(item);
    } else if (op.type === "delete") {
      state[op.table] = coll.filter(x => x.id !== op.id);
    } else if (op.type === "clear") {
      state[op.table] = [];
    }
  }
  return state;
}

let SYNCED = false;
async function loadRemote() {
  if (!sb) return;
  try {
    const res = await Promise.all([
      sb.from("players").select("*").order("id"),

      sb.from("rewards").select("*").order("id"),
      sb.from("objectives").select("*").order("created_at"),
      sb.from("log").select("*").order("ts"),
      sb.from("won").select("*").order("ts"),
      sb.from("bets").select("*").order("created_at"),
    ]);
    for (const r of res) if (r.error) throw r.error;
    const fresh = { players: [], tasks: [], rewards: [], objectives: [], log: [], won: [], bets: [] };
    TABLES.forEach((n, i) => { fresh[n] = res[i].data.map(fromRow[n]); });
    if (fresh.players.length < 2) fresh.players = defaultState().players;
    S = applyPending(fresh);
    SYNCED = true;
    save(); scheduleRender();
  } catch (e) { SYNCED = false; }
  renderSync();
}

/* ================= Time helpers ================= */
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
function weekKey(ts) {
  const d = new Date(ts); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // lundi
  return dayKey(d.getTime());
}
const monthKey = ts => dayKey(ts).slice(0, 7);
const NOW = () => Date.now();

/* ================= Derived stats ================= */
function xpOf(pid, filter) {
  return S.log.reduce((a, l) => a + ((l.playerId === pid && (!filter || filter(l))) ? l.xp : 0), 0);
}
function totalXp(pid) { return xpOf(pid); }
function weekXp(pid) { const wk = weekKey(NOW()); return xpOf(pid, l => weekKey(l.ts) === wk); }
function monthXp(pid) { const mk = monthKey(NOW()); return xpOf(pid, l => monthKey(l.ts) === mk); }
function taskCount(pid, filter) { return S.log.filter(l => l.playerId === pid && (!filter || filter(l))).length; }

// Niveau : chaque niveau N -> N+1 coûte 100 + 30*(N-1) XP
function levelInfo(xp) {
  let lvl = 1, need = 100, rest = xp;
  while (rest >= need) { rest -= need; lvl++; need = 100 + 30 * (lvl - 1); }
  return { lvl, into: rest, need };
}
function rankOf(lvl) {
  if (lvl >= 50) return { r: "MONARQUE", s: true };
  if (lvl >= 30) return { r: "S", s: true };
  if (lvl >= 20) return { r: "A", s: false };
  if (lvl >= 15) return { r: "B", s: false };
  if (lvl >= 10) return { r: "C", s: false };
  if (lvl >= 5)  return { r: "D", s: false };
  return { r: "E", s: false };
}
// Série : jours consécutifs (finissant aujourd'hui ou hier) avec >= 1 tâche
function streakOf(pid) {
  const days = new Set(S.log.filter(l => l.playerId === pid).map(l => dayKey(l.ts)));
  let n = 0;
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1); // série encore vivante si tâche hier
  while (days.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function streakMult(pid) { return 1 + Math.min(streakOf(pid), 10) * 0.05; } // +5%/jour, max +50%

// Tâche bonus du jour (déterministe à partir de la date)
function bonusTaskId() {
  if (!S.tasks.length) return null;
  const k = dayKey(NOW());
  let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return S.tasks[h % S.tasks.length].id;
}

];
function bestStreakOf(pid) {
  const days = [...new Set(S.log.filter(l => l.playerId === pid).map(l => dayKey(l.ts)))].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) {
    if (prev) {
      const nd = new Date(prev + "T12:00"); nd.setDate(nd.getDate() + 1);
      run = dayKey(nd.getTime()) === d ? run + 1 : 1;
    } else run = 1;
    best = Math.max(best, run); prev = d;
  }
  return best;
}
function featStats(pid) {
  const mine = S.log.filter(l => l.playerId === pid);
  const xp = mine.reduce((a, l) => a + l.xp, 0);
  return {
    count: mine.length, xp,
    lvl: levelInfo(xp).lvl,
    bestStreak: bestStreakOf(pid),
    big: mine.filter(l => l.xp >= 50).length,
    early: mine.some(l => new Date(l.ts).getHours() < 8),
    night: mine.some(l => new Date(l.ts).getHours() >= 22),
  };
}
function unlockedFeats(pid) {
  const st = featStats(pid);
  return FEATS.filter(f => f.test(st));
}

function objProgress(o) {
  const f = l => l.ts >= o.createdAt;
  return o.type === "xp"
    ? S.log.filter(f).reduce((a, l) => a + l.xp, 0)
    : S.log.filter(f).length;
}

  if (!notifsOn() || notifiedToday() || Notification.permission !== "granted" || !shouldShowEveningReminder()) return;
  const body = eveningReminderTextPlain();
  const title = "⚔️ Rangement — ne perds pas ta série !";
  let sent = false;
  try {
    const reg = navigator.serviceWorker && (await navigator.serviceWorker.getRegistration());
    if (reg && reg.showNotification) {
      await reg.showNotification(title, { body, icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: "rangement-streak" });

    catch (e) { /* notification indisponible sur cet appareil, tant pis */ }

}

// Tâche la plus "en retard" : jamais faite, sinon faite il y a le plus longtemps.
function overdueTaskId() {
  if (!S.tasks.length) return null;
  let best = null, bestTs = Infinity;
  for (const t of S.tasks) {
    const last = [...S.log].reverse().find(l => l.taskName === t.name);
    const ts = last ? last.ts : -Infinity; // jamais faite = priorité maximale
    if (ts < bestTs) { bestTs = ts; best = t.id; }
  }
  return best;
}

function activeBet() {
  const cur = weekKey(NOW());
  return (S.bets || []).find(b => b.week === cur && !b.claimed) || null;
}
function betRewardLabel(b) {
  if (b.rewardId === "__random__") return "🎲 Récompense surprise";
  const r = S.rewards.find(x => x.id === b.rewardId);
  return r ? esc(r.icon) + " " + esc(r.name) : "🎁 Récompense";
}

/* ---------- Duel ---------- */
function trophyData() {
  const [a, b] = S.players;
  const cur = weekKey(NOW());
  const byWeek = {};
  for (const l of S.log) {
    const wk = weekKey(l.ts);
    if (wk === cur) continue;
    (byWeek[wk] ??= { a: 0, b: 0 })[l.playerId === a.id ? "a" : "b"] += l.xp;
  }
  let winsA = 0, winsB = 0;
  for (const wk in byWeek) {
    if (byWeek[wk].a > byWeek[wk].b) winsA++;
    else if (byWeek[wk].b > byWeek[wk].a) winsB++;
  }
  return { byWeek, winsA, winsB };
}

function trophyWall(byWeek) {
  const [a, b] = S.players;
  const weeks = Object.keys(byWeek).sort().reverse().slice(0, 12);
  if (!weeks.length) return '<p class="hint">Le premier trophée sera décerné à la fin de cette semaine. Que la chasse commence ! 👑</p>';
  return weeks.map(wk => {
    const x = byWeek[wk];
    const d = new Date(wk + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    const win = x.a === x.b ? null : (x.a > x.b ? a : b);
    return `<div class="trophyline">
      <span class="tw">Sem. du ${d}</span>
      <span class="grow">${win ? "👑 " + esc(win.emoji + " " + win.name) : "⚡ Égalité"}</span>
      <span class="tscore">${x.a} – ${x.b}</span>
    </div>`;
  }).join("");
}

function betSection() {
  const cur = weekKey(NOW());
  const bets = S.bets || [];
  const active = activeBet();
  const pending = bets.filter(b => !b.claimed && b.week < cur);
  const { byWeek } = trophyData();

  const pendingRows = pending.map(b => {
    const x = byWeek[b.week] || { a: 0, b: 0 };
    const win = x.a === x.b ? null : (x.a > x.b ? S.players[0] : S.players[1]);
    const d = new Date(b.week + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    return win
      ? `<div class="betline">👑 <b>${esc(win.name)}</b> a remporté l'enjeu de la sem. du ${d} : ${betRewardLabel(b)}
         <button class="claim" data-claimbet="${b.id}">Réclamer l'enjeu</button></div>`
      : `<div class="betline">⚡ Égalité sur la sem. du ${d} — l'enjeu ${betRewardLabel(b)} est retiré
         <button class="undo" style="margin-top:8px" data-tiebet="${b.id}">Retirer l'enjeu</button></div>`;
  }).join("");

  const activeHtml = active
    ? `<div class="betline hot">⚔️ Enjeu de la semaine : <b>${betRewardLabel(active)}</b><br>
       <span class="hint">Le vainqueur du duel dimanche soir l'emporte. Bonne chasse !</span></div>`
    : `<div class="frow" style="margin-top:4px">
        <select id="betReward">
          ${S.rewards.map(r => `<option value="${r.id}">${esc(r.icon)} ${esc(r.name)}</option>`).join("")}
          <option value="__random__">🎲 Surprise (tirage au sort)</option>
        </select>
        <button class="btn" id="betAdd">Miser</button>
      </div>
      <p class="hint">Misez une récompense sur le duel : celui ou celle qui gagne la semaine l'emporte.</p>`;

  return `<section class="panel"><h2>Pari de duel</h2>${pendingRows}${activeHtml}</section>`;
}

function weekChartData() {
  const [a, b] = S.players;
  const monday = new Date(); monday.setHours(0, 0, 0, 0);
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const w = new Date(monday); w.setDate(monday.getDate() - i * 7);
    weeks.push(weekKey(w.getTime()));
  }
  const sum = (pid, wk) => S.log.reduce((acc, l) => acc + ((l.playerId === pid && weekKey(l.ts) === wk) ? l.xp : 0), 0);
  const data = weeks.map((wk, i) => ({ wk, a: sum(a.id, wk), b: sum(b.id, wk), label: i === 7 ? "Cette semaine" : "Il y a " + (7 - i) + " sem." }));
  return { a, b, weeks, data };
}

let chartView = "chart"; // "chart" ou "table" — préférence de session, pas persistée
function weekTable(a, b, data) {
  return `
  <div class="tblwrap">
    <table class="datatable">
      <caption class="sr-only">XP gagnés par semaine, huit dernières semaines</caption>
      <thead><tr><th scope="col">Semaine</th><th scope="col">${esc(a.emoji)} ${esc(a.name)}</th><th scope="col">${esc(b.emoji)} ${esc(b.name)}</th></tr></thead>
      <tbody>
        ${data.map(x => `<tr><th scope="row">${x.label}</th><td>${x.a} XP</td><td>${x.b} XP</td></tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function weekChart() {
  const { a, b, data } = weekChartData();
  const max = Math.max(20, ...data.map(x => Math.max(x.a, x.b)));
  const W = 320, H = 112, base = H - 14, plot = H - 22, gw = W / 8, bw = 13;
  const grid = [0.5, 1].map(f => {
    const y = (base - plot * f).toFixed(1);
    return `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#1C3252" stroke-width="1"/>` +
      `<text x="2" y="${y - 3}" font-size="8" fill="#8AA3C2">${Math.round(max * f)}</text>`;
  }).join("");
  let bars = "", labels = "";
  data.forEach((x, i) => {
    const cx = i * gw + gw / 2;
    const ha = Math.max(1, Math.round(plot * x.a / max)), hb = Math.max(1, Math.round(plot * x.b / max));
    bars += `<rect x="${(cx - bw - 1).toFixed(1)}" y="${base - ha}" width="${bw}" height="${ha}" rx="2" fill="${esc(a.color)}"><title>${esc(a.name)} · ${x.a} XP</title></rect>` +
            `<rect x="${(cx + 1).toFixed(1)}" y="${base - hb}" width="${bw}" height="${hb}" rx="2" fill="${esc(b.color)}"><title>${esc(b.name)} · ${x.b} XP</title></rect>`;
    labels += `<text x="${cx}" y="${H - 2}" text-anchor="middle" font-size="8" fill="#8AA3C2">${i === 7 ? "cette sem." : "S−" + (7 - i)}</text>`;
  });
  return `
  <div class="legend">
    <span><i class="dot" style="background:${esc(a.color)}"></i>${esc(a.name)}</span>
    <span><i class="dot" style="background:${esc(b.color)}"></i>${esc(b.name)}</span>
  </div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP gagnés par semaine, huit dernières semaines" style="width:100%;height:auto;display:block">
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#2B5A8F" stroke-width="1"/>
    ${grid}${bars}${labels}
  </svg>`;
}

function taskSplit() {
  const [a, b] = S.players;
  const counts = S.tasks.map(t => {
    const countFor = pid => S.log.filter(l => l.taskName === t.name && l.playerId === pid).length;
    const ca = countFor(a.id), cb = countFor(b.id), total = ca + cb;
    return { t, ca, cb, total };
  }).filter(x => x.total > 0).sort((x, y) => y.total - x.total);
  if (!counts.length) return '<p class="hint">Accomplissez quelques quêtes pour voir la répartition apparaître ici.</p>';
  return counts.map(({ t, ca, cb, total }) => {
    const pa = Math.round(100 * ca / total);
    const unfair = total >= 3 && (ca === 0 || cb === 0 || pa >= 80 || pa <= 20);
    return `
    <div class="splitline">
      <span class="qi" style="font-size:18px">${esc(t.icon)}</span>
      <span class="grow">${esc(t.name)}</span>
      <span class="splitcounts">${ca} – ${cb}</span>
      ${unfair ? '<span class="chip gold" title="Nettement déséquilibré">⚖️</span>' : ""}
    </div>
    <div class="splitbar"><i style="width:${pa}%;background:${esc(a.color)}"></i><i style="width:${100 - pa}%;background:${esc(b.color)}"></i></div>`;
  }).join("");
}

function featSection() {
  return S.players.map(p => {

    return `

}

    </div>
  </section>
  <section class="panel">
    <div class="panelhead">
      <h2 style="margin-bottom:0">Mur des trophées</h2>
      <button class="linkbtn" id="shareTrophyBtn">📤 Partager</button>
    </div>
    ${trophyWall(trophies.byWeek)}

  <section class="panel">

let journalFilter = { q: "", player: "all" }; // session seulement, pas persisté

function vJournal() {
  if (!S.log.length) return `<section class="panel"><h2>Journal de chasse</h2><p class="hint">Rien pour l'instant — la première quête vous attend.</p></section>`;

  const q = journalFilter.q.trim().toLowerCase();
  const filtered = S.log.filter(l => {
    if (journalFilter.player !== "all" && l.playerId !== journalFilter.player) return false;
    if (q && !l.taskName.toLowerCase().includes(q)) return false;
    return true;
  });

  const filterBar = `
  <div class="frow" style="margin-bottom:9px">
    <input type="text" id="journalSearch" placeholder="Rechercher une tâche…" value="${esc(journalFilter.q)}" aria-label="Rechercher dans le journal">
  </div>
  <div class="filterrow">
    <button class="filterbtn ${journalFilter.player === "all" ? "on" : ""}" data-jf="all">Tous</button>
    ${S.players.map(p => `<button class="filterbtn ${journalFilter.player === p.id ? "on" : ""}" data-jf="${p.id}">${esc(p.emoji)} ${esc(p.name)}</button>`).join("")}
  </div>`;

  if (!filtered.length) {
    return `<section class="panel"><h2>Journal de chasse</h2>${filterBar}<p class="hint" style="margin-top:10px">Aucune entrée ne correspond à ce filtre.</p></section>`;
  }

  const byDay = {};
  for (const l of filtered.slice().reverse()) (byDay[dayKey(l.ts)] ??= []).push(l);
  const days = Object.keys(byDay).map(k => {
    const label = new Date(k + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

      const p = S.players.find(x => x.id === l.playerId);

      </div>`;
    }).join("");
  }).join("");
  return `<section class="panel"><h2>Journal de chasse</h2>${filterBar}${days}</section>`;
}

/* ================= Actions ================= */
function toast(msg, actionLabel, actionFn) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  if (actionLabel && actionFn) {
    const b = document.createElement("button");
    b.className = "toast-action";
    b.textContent = actionLabel;
    b.onclick = () => { t.remove(); actionFn(); };
    t.appendChild(b);
  }
  $("#toastZone").appendChild(t);
  setTimeout(() => t.remove(), actionLabel ? 5000 : 2200);
}

/* ---------- Confettis (canvas, sobre, respecte le mouvement réduit) ---------- */
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confettiBurst() {
  if (REDUCE_MOTION) return;
  const canvas = document.createElement("canvas");
  canvas.id = "confetti";
  canvas.style.cssText = "position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%";
  document.body.appendChild(canvas);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.width = innerWidth * dpr, H = canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext("2d");
  const colors = ["#F0C550", "#4DC3FF", "#8B7BFF", "#5CE0A5", "#FF9D5C"];
  const N = 90;
  const parts = Array.from({ length: N }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3,
    y: H * 0.28,
    vx: (Math.random() - 0.5) * 9 * dpr,
    vy: (-Math.random() * 7 - 3) * dpr,
    g: 0.22 * dpr,
    size: (Math.random() * 5 + 3) * dpr,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.3,
    color: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  function frame(t) {
    const dt = Math.min((t - t0) / 1000, 1.6);
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr;
      const fade = Math.max(0, 1 - dt / 1.6);
      if (fade <= 0 || p.y > H + 40) continue;
      alive = true;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

/* ---------- Carte partageable (canvas, aux couleurs du thème actif) ---------- */
function cardColors() {
  const cs = getComputedStyle(document.documentElement);
  const col = (name, fallback) => (cs.getPropertyValue(name).trim() || fallback);
  return {
    abyss: "#060A13", panel: col("--panel", "#0C1526"), line: col("--line", "#1C3252"),
    sys: col("--sys", "#4DC3FF"), gold: "#F0C550", ink: col("--ink", "#D9E7F7"), inkDim: col("--ink-dim", "#8AA3C2"),
  };
}
function cardCanvas(W, H, c) {
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const bg = ctx.createRadialGradient(W / 2, 160, 60, W / 2, 160, 900);
  bg.addColorStop(0, "#101D33"); bg.addColorStop(1, c.abyss);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  return { canvas, ctx };
}
function cardHeader(ctx, W, c, subtitle) {
  ctx.fillStyle = c.sys;
  ctx.font = "700 28px system-ui, sans-serif";
  ctx.fillText("S Y S T È M E", W / 2, 130);
  ctx.fillStyle = c.ink;
  ctx.font = "900 64px system-ui, sans-serif";
  ctx.fillText("RANGEMENT", W / 2, 210);
  ctx.fillStyle = c.inkDim;
  ctx.font = "500 24px system-ui, sans-serif";
  ctx.fillText(subtitle, W / 2, 255);
}
function cardFooter(ctx, W, c, y) {
  ctx.fillStyle = c.inkDim;
  ctx.font = "500 22px system-ui, sans-serif";
  ctx.fillText(new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }), W / 2, y);
  ctx.fillStyle = c.sys;
  ctx.font = "700 24px system-ui, sans-serif";
  ctx.fillText("⚔️ rangement — ménage gamifié ⚔️", W / 2, y + 50);
}

function buildTrophyCard() {
  const [a, b] = S.players;
  const trophies = trophyData();
  const la = levelInfo(totalXp(a.id)), lb = levelInfo(totalXp(b.id));
  const ra = rankOf(la.lvl), rb = rankOf(lb.lvl);
  const c = cardColors();
  const { panel, line, sys, gold, ink, inkDim } = c;

  const W = 1080, H = 1350;
  const { canvas, ctx } = cardCanvas(W, H, c);
  cardHeader(ctx, W, c, "Mur des trophées");

  function playerBlock(cx, p, lvl, rank, trophyCount) {
    ctx.fillStyle = panel;
    ctx.strokeStyle = rank.s ? gold : line;
    ctx.lineWidth = 3;
    const bx = cx - 220, by = 320, bw = 440, bh = 560, r = 20;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, r);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.color || sys;
    ctx.font = "900 120px system-ui, sans-serif";
    ctx.fillText(p.emoji || "⚔️", cx, by + 150);
    ctx.fillStyle = ink;
    ctx.font = "700 42px system-ui, sans-serif";
    ctx.fillText(p.name, cx, by + 220);
    ctx.fillStyle = rank.s ? gold : (p.color || sys);
    ctx.font = "900 56px system-ui, sans-serif";
    ctx.fillText(rank.r, cx, by + 300);
    ctx.fillStyle = inkDim;
    ctx.font = "500 26px system-ui, sans-serif";
    ctx.fillText("Niveau " + lvl, cx, by + 345);
    ctx.fillStyle = gold;
    ctx.font = "700 34px system-ui, sans-serif";
    ctx.fillText("👑 " + trophyCount + " trophée" + (trophyCount > 1 ? "s" : ""), cx, by + 420);
    ctx.fillStyle = inkDim;
    ctx.font = "500 24px system-ui, sans-serif";
    ctx.fillText(totalXp(p.id) + " XP au total", cx, by + 465);
  }
  playerBlock(W / 2 - 250, a, la.lvl, ra, trophies.winsA);
  playerBlock(W / 2 + 250, b, lb.lvl, rb, trophies.winsB);

  cardFooter(ctx, W, c, 950);
  return canvas;
}

function buildDuelCard() {
  const [a, b] = S.players;
  const wa = weekXp(a.id), wb = weekXp(b.id), tot = wa + wb;
  const pa = tot ? Math.round(100 * wa / tot) : 50;
  const lead = wa === wb ? null : (wa > wb ? a : b);
  const c = cardColors();
  const { panel, line, sys, gold, ink, inkDim } = c;

  const W = 1080, H = 1150;
  const { canvas, ctx } = cardCanvas(W, H, c);
  cardHeader(ctx, W, c, "Duel de la semaine");

  function playerBlock(cx, p, xp) {
    ctx.fillStyle = panel;
    ctx.strokeStyle = (lead && lead.id === p.id) ? gold : line;
    ctx.lineWidth = 3;
    const bx = cx - 220, by = 320, bw = 440, bh = 330, r = 20;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, r);
    ctx.fill(); ctx.stroke();
    if (lead && lead.id === p.id) {
      ctx.font = "56px system-ui, sans-serif";
      ctx.fillText("👑", cx, by - 20);
    }
    ctx.fillStyle = p.color || sys;
    ctx.font = "900 110px system-ui, sans-serif";
    ctx.fillText(p.emoji || "⚔️", cx, by + 140);
    ctx.fillStyle = ink;
    ctx.font = "700 40px system-ui, sans-serif";
    ctx.fillText(p.name, cx, by + 205);
    ctx.fillStyle = c.sys;
    ctx.font = "900 46px system-ui, sans-serif";
    ctx.fillText(xp + " XP", cx, by + 270);
    ctx.fillStyle = inkDim;
    ctx.font = "500 24px system-ui, sans-serif";
    ctx.fillText("cette semaine", cx, by + 305);
  }
  playerBlock(W / 2 - 250, a, wa);
  playerBlock(W / 2 + 250, b, wb);

  const barY = 730, barW = 700, barH = 26, barX = W / 2 - barW / 2;
  ctx.fillStyle = line;
  ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, barH / 2); ctx.fill();
  ctx.fillStyle = a.color || sys;
  ctx.beginPath(); ctx.roundRect(barX, barY, barW * pa / 100, barH, barH / 2); ctx.fill();
  ctx.fillStyle = b.color || sys;
  ctx.save(); ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, barH / 2); ctx.clip();
  ctx.fillRect(barX + barW * pa / 100, barY, barW * (100 - pa) / 100, barH);
  ctx.restore();

  ctx.fillStyle = gold;
  ctx.font = "700 34px system-ui, sans-serif";
  ctx.fillText(lead ? "👑 " + lead.name + " mène le duel" : "⚡ Égalité parfaite", W / 2, 810);

  cardFooter(ctx, W, c, 950);
  return canvas;
}

function shareCanvasCard(canvas, filenamePrefix, shareTitle, shareText) {
  canvas.toBlob(async blob => {
    if (!blob) { toast("Export impossible"); return; }
    const filename = filenamePrefix + "-" + dayKey(NOW()) + ".png";
    const file = (typeof File !== "undefined") ? new File([blob], filename, { type: "image/png" }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: shareTitle, text: shareText });
        return;
      } catch (e) { /* partage annulé ou indisponible -> repli téléchargement */ }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }, "image/png");
}
function shareTrophyCard() {
  shareCanvasCard(buildTrophyCard(), "rangement-trophees", "Rangement — Mur des trophées", "Notre chasse au ménage 👑⚔️");
}
function shareDuelCard() {
  shareCanvasCard(buildDuelCard(), "rangement-duel", "Rangement — Duel de la semaine", "Qui va gagner cette semaine ? ⚔️🔥");
}

function sysModal(html, onClose) {

  <div class="veil" id="veil">

      <div class="bang">Notification</div>
      ${html}

    </div>
  </div>`;
  $("#veilOk").onclick = () => { $("#modal").innerHTML = ""; if (onClose) onClose(); };
}

function doTask(taskId, playerId) {
  const t = S.tasks.find(x => x.id === taskId);
  const p = S.players.find(x => x.id === playerId);
  if (!t || !p) return;
  const before = levelInfo(totalXp(playerId)).lvl;
  const objsBefore = S.objectives.filter(o => !o.claimed && objProgress(o) >= o.target).length;
  const featsBefore = new Set(unlockedFeats(playerId).map(f => f.id));

  let xp = PRIOS[t.prio].xp;
  const notes = [];
  if (t.id === bonusTaskId()) { xp *= 2; notes.push("×2"); }
  const mult = streakMult(playerId);
  if (mult > 1) { xp = Math.round(xp * mult); notes.push("🔥+" + Math.round((mult - 1) * 100) + "%"); }

  const entry = { id: uid(), ts: NOW(), playerId, taskName: t.name, icon: t.icon, xp, note: notes.join(" ") };
  S.log.push(entry);
  save();
  queueOp({ table: "log", type: "upsert", row: toRow.log(entry) });
  try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}

  const after = levelInfo(totalXp(playerId)).lvl;
  const objsAfter = S.objectives.filter(o => !o.claimed && objProgress(o) >= o.target).length;
  const newFeat = unlockedFeats(playerId).find(f => !featsBefore.has(f.id));
  render();

  if (after > before) {
    chime("level");
    const rk = rankOf(after);
    sysModal(`
      <div class="big">NIVEAU ${after}</div>
      <div class="sub">${esc(p.emoji)} <b>${esc(p.name)}</b> monte en puissance !<br>Rang actuel : <b class="${rk.s ? "gold" : ""}">${rk.r}</b></div>`);
  } else if (objsAfter > objsBefore) {
    chime("level");
    sysModal(`
      <div class="big gold">OBJECTIF ATTEINT</div>
      <div class="sub">Un défi commun est terminé.<br>Allez le réclamer dans l'onglet <b>Objectifs</b> 🎁</div>`);
  } else if (newFeat) {
    chime("feat");
    sysModal(`
      <div class="big gold">HAUT FAIT</div>
      <div class="sub">${esc(p.emoji)} <b>${esc(p.name)}</b> débloque :<br><span style="font-size:26px">${newFeat.icon}</span><br><b>${esc(newFeat.name)}</b></div>`);
  } else {
    toast(`${p.emoji} ${p.name} +${xp} XP`, "Annuler", () => {
      S.log = S.log.filter(l => l.id !== entry.id);
      save(); queueOp({ table: "log", type: "delete", id: entry.id });
      render();
    });
  }
}

  };
  document.querySelectorAll("[data-claim]").forEach(b =>
    b.onclick = () => {
      const o = S.objectives.find(x => x.id === b.dataset.claim);
      if (!o) return;
      const surprise = o.rewardId === "__random__";
      const rw = (surprise
        ? S.rewards[Math.floor(Math.random() * S.rewards.length)]
        : S.rewards.find(r => r.id === o.rewardId)) || { name: "Récompense au choix", icon: "🎁" };
      o.claimed = true;
      const w = { id: uid(), name: rw.name, icon: rw.icon, ts: NOW() };
      S.won.push(w);
      save();
      queueOp({ table: "objectives", type: "upsert", row: toRow.objectives(o) });
      queueOp({ table: "won", type: "upsert", row: toRow.won(w) });
      render();
      confettiBurst();
      sysModal(`
        <div class="big gold">RÉCOMPENSE</div>
        <div class="sub">${surprise ? "🎲 Le sort a désigné :" : "Vous avez gagné :"}<br><b>${esc(rw.icon)} ${esc(rw.name)}</b><br>Profitez-en bien, vous l'avez mérité 💙</div>`);

  document.querySelectorAll("[data-delobj]").forEach(b =>

        ? S.rewards[Math.floor(Math.random() * S.rewards.length)]
        : S.rewards.find(r => r.id === b.rewardId)) || { icon: "🎁", name: "Récompense" };

    b.onclick = () => {
      S.rewards = S.rewards.filter(r => r.id !== b.dataset.delrw);
      save(); queueOp({ table: "rewards", type: "delete", id: b.dataset.delrw });
      render();
    });

  // Réglages
  const sp = $("#savePlayers");
  if (sp) sp.onclick = () => {
    S.players.forEach(p => {
      const n = document.querySelector(`[data-pname="${p.id}"]`).value.trim();
      const e = document.querySelector(`[data-pemoji="${p.id}"]`).value.trim();
      const c = document.querySelector(`[data-pcolor="${p.id}"]`).value;
      if (n) p.name = n;
      if (e) p.emoji = e;
      if (c) p.color = c;
      queueOp({ table: "players", type: "upsert", row: toRow.players(p) });
    });
    save(); render(); toast("Chasseurs mis à jour");
  };
  const tAdd = $("#tAdd");
  if (tAdd) tAdd.onclick = () => {
    const name = $("#tName").value.trim();
    if (!name) return;
    const t = { id: uid(), name, icon: $("#tIcon").value.trim() || "🧼", prio: $("#tPrio").value, createdAt: NOW() };
    S.tasks.push(t);
    save(); queueOp({ table: "tasks", type: "upsert", row: toRow.tasks(t) });
    render(); toast("Quête ajoutée");
  };
  document.querySelectorAll("[data-deltask]").forEach(b =>
    b.onclick = () => {
      S.tasks = S.tasks.filter(t => t.id !== b.dataset.deltask);
      save(); queueOp({ table: "tasks", type: "delete", id: b.dataset.deltask });
      render();
    });
  document.querySelectorAll("[data-tprio]").forEach(sel =>
    sel.onchange = () => {
      const t = S.tasks.find(x => x.id === sel.dataset.tprio);
      if (t) {
        t.prio = sel.value;
        save(); queueOp({ table: "tasks", type: "upsert", row: toRow.tasks(t) });
        render();
      }
    });

  // Apparence
  document.querySelectorAll("[data-theme]").forEach(b =>
    b.onclick = () => { applyTheme(b.dataset.theme); render(); });
  const soundToggle = $("#soundToggle");
  if (soundToggle) soundToggle.onchange = () => {
    localStorage.setItem("rangement-sound", soundToggle.checked ? "on" : "off");
    if (soundToggle.checked) chime("feat");
  };
  const suggestToggle = $("#suggestToggle");
  if (suggestToggle) suggestToggle.onchange = () => {
    localStorage.setItem("rangement-suggest", suggestToggle.checked ? "on" : "off");
  };

  // Rappel du soir
  const eveningToggle = $("#eveningToggle");
  if (eveningToggle) eveningToggle.onchange = () => {
    localStorage.setItem("rangement-evening", eveningToggle.checked ? "on" : "off");
  };
  const eveningHour = $("#eveningHour");
  if (eveningHour) eveningHour.onchange = () => {
    const v = Math.min(23, Math.max(0, parseInt(eveningHour.value, 10) || 20));
    localStorage.setItem("rangement-evening-hour", String(v));
  };
  const recapToggle = $("#recapToggle");
  if (recapToggle) recapToggle.onchange = () => {
    localStorage.setItem("rangement-recap", recapToggle.checked ? "on" : "off");
  };
  const notifToggle = $("#notifToggle");
  if (notifToggle) notifToggle.onchange = async () => {
    if (!notifToggle.checked) { localStorage.setItem("rangement-notifs", "off"); return; }
    if (!notifsSupported()) { toast("Notifications non disponibles sur cet appareil"); notifToggle.checked = false; return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      toast("Permission refusée — activable dans les réglages du navigateur");
      notifToggle.checked = false;
      localStorage.setItem("rangement-notifs", "off");
      return;
    }
    localStorage.setItem("rangement-notifs", "on");
    toast("Notifications activées 🔔");
  };

  // Données
  const ex = $("#exportBtn");
  if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rangement-sauvegarde-" + dayKey(NOW()) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const im = $("#importBtn");
  if (im) im.onclick = () => $("#importFile").click();
  const imf = $("#importFile");
  if (imf) imf.onchange = () => {
    const f = imf.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        const src = data.S || data; // accepte les sauvegardes v1 et v2
        if (!src.players || !src.log) throw new Error("format");
        S = Object.assign(defaultState(), src);
        TABLES.forEach(t => (S[t] || []).forEach(x => PENDING.push({ table: t, type: "upsert", row: toRow[t](x) })));
        save(); flushOps(); render(); toast("Sauvegarde importée ✅");
      } catch (e) { toast("Fichier invalide"); }
    };
    r.readAsText(f);
  };
  const rst = $("#resetBtn");
  if (rst) rst.onclick = () => {
    if (confirm("Remettre l'aventure à zéro pour vous deux ? Journal, niveaux, objectifs et récompenses gagnées seront effacés (les tâches et idées de récompenses sont conservées).")) {
      S.log = []; S.won = []; S.objectives = [];
      ["log", "won", "objectives"].forEach(t => queueOp({ table: t, type: "clear" }));
      save(); render();
    }
  };
}

/* ---------- Thèmes (préférence propre à cet appareil) ---------- */
const THEMES = {
  systeme:  { label: "Système",  sys: "#4DC3FF", sysDim: "#2E7FB8", glow: "#2B5A8F", mana: "#8B7BFF" },
  monarque: { label: "Monarque", sys: "#8B7BFF", sysDim: "#5E50C4", glow: "#4A3F9E", mana: "#4DC3FF" },
  braise:   { label: "Braise",   sys: "#FF8A5C", sysDim: "#C05A32", glow: "#8F3A2B", mana: "#F0C550" },
  guilde:   { label: "Guilde",   sys: "#5CE0A5", sysDim: "#2FA372", glow: "#22684D", mana: "#4DC3FF" },
};
function curTheme() { return localStorage.getItem("rangement-theme") || "systeme"; }
function applyTheme(id) {
  const t = THEMES[id] || THEMES.systeme;
  const r = document.documentElement.style;
  r.setProperty("--sys", t.sys);
  r.setProperty("--sys-dim", t.sysDim);
  r.setProperty("--line-glow", t.glow);
  r.setProperty("--mana", t.mana);
  localStorage.setItem("rangement-theme", id);
}

/* ---------- Premier lancement : réveil du Système ---------- */
function onboarding() {
  if (localStorage.getItem("rangement-onboard-v1")) return;
  let step = 0;
  const stepHtml = () => {
    if (step === 0) return `
      <div class="big">RÉVEIL DU SYSTÈME</div>
      <div class="sub" style="text-align:left">Chaque tâche ménagère est une <b>quête</b> qui rapporte de l'<b>XP</b> selon sa priorité (10 à 50).<br><br>Vous montez de <b>niveau</b> et de <b>rang</b> (E → S → Monarque). Jouez chaque jour pour le bonus de série 🔥, et guettez la quête dorée ×2.</div>`;
    if (step === 1) return `
      <div class="big">VOS CHASSEURS</div>
      <div class="sub" style="text-align:left">Personnalisez vos profils (modifiables plus tard dans Réglages) :</div>
      ${S.players.map(p => `
      <div class="frow" style="margin-top:10px">
        <input type="text" data-ob-emoji="${p.id}" value="${esc(p.emoji)}" maxlength="4" style="flex:0 0 56px" aria-label="Emoji">
        <input type="text" data-ob-name="${p.id}" value="${esc(p.name)}" maxlength="20" aria-label="Nom">
        <input type="color" data-ob-color="${p.id}" value="${esc(p.color || "#4DC3FF")}" style="flex:0 0 46px;height:42px;padding:2px;background:#0A1120;border:1px solid var(--line);border-radius:3px" aria-label="Couleur">
      </div>`).join("")}`;
    return `
      <div class="big gold">LA CHASSE</div>
      <div class="sub" style="text-align:left">⚔️ Touchez <b>votre emoji</b> sur une quête accomplie.<br>👑 L'onglet <b>Duel</b> compare vos scores — un trophée par semaine gagnée.<br>🏆 Créez des <b>objectifs communs</b> : atteints, ils débloquent vos récompenses (ciné, resto, surprise 🎲…).<br><br>Que le meilleur chasseur gagne 💙</div>`;
  };
  const finish = () => {
    localStorage.setItem("rangement-onboard-v1", "1");
    $("#modal").innerHTML = "";
    render();
  };
  const show = () => {
    $("#modal").innerHTML = `
    <div class="veil">
      <div class="sysbox" role="dialog" aria-modal="true">
        <div class="bang">Notification</div>
        ${stepHtml()}
        <div class="frow" style="margin-top:16px">
          <button class="btn ghost" id="obSkip">Passer</button>
          <button class="btn" id="obNext">${step === 2 ? "Commencer la chasse" : "Suivant"}</button>
        </div>
      </div>
    </div>`;
    $("#obSkip").onclick = finish;
    $("#obNext").onclick = () => {
      if (step === 1) {
        S.players.forEach(p => {
          const n = document.querySelector(`[data-ob-name="${p.id}"]`).value.trim();
          const e = document.querySelector(`[data-ob-emoji="${p.id}"]`).value.trim();
          const c = document.querySelector(`[data-ob-color="${p.id}"]`).value;
          if (n) p.name = n;
          if (e) p.emoji = e;
          if (c) p.color = c;
          queueOp({ table: "players", type: "upsert", row: toRow.players(p) });
        });
        save(); render();
      }
      if (step === 2) return finish();
      step++; show();
    };
  };
  show();
}

/* ---------- Sons (synthétisés, pas de fichier externe) ---------- */
function soundsOn() { return localStorage.getItem("rangement-sound") !== "off"; }
let audioCtx = null;
function chime(kind) {
  if (!soundsOn()) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const notes = kind === "level" ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 987.77];
    const t0 = audioCtx.currentTime;
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      const start = t0 + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.34);
    });
  } catch (e) { /* audio indisponible, tant pis */ }
}

applyTheme(curTheme());
render();
loadRemote();
flushOps();
onboarding();
if (!localStorage.getItem("rangement-onboard-v1")) {
  // premier lancement : l'onboarding prime sur le récap, pas de double fenêtre
} else if (shouldShowWeeklyRecap()) {
  weeklyRecapModal();
}
maybeSendStreakNotification();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js");
}
</script>
