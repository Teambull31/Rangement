<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rangement — Système de Chasse</title>
<meta name="description" content="Ménage gamifié pour deux, style Solo Leveling : quêtes, XP, rangs, duel et récompenses.">
<meta name="theme-color" content="#060A13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rangement">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="supabase.js"></script>
<style>
  :root {
    --abyss: #060A13;
    --panel: #0C1526;
    --panel-2: #101D33;
    --line: #1C3252;
    --line-glow: #2B5A8F;
    --sys: #4DC3FF;
    --sys-dim: #2E7FB8;
    --mana: #8B7BFF;
    --gold: #F0C550;
    --crit: #FF5C6E;
    --high: #FF9D5C;
    --prio-basse: #8AA3C2;
    --prio-normale: #4DC3FF;
    --ok: #5CE0A5;
    --ink: #D9E7F7;
    --ink-dim: #8AA3C2;
    --field: #0A1120;
    --navbg: rgba(8,13,24,.92);
    --logo-top: #EAF6FF;
    --modalbg: linear-gradient(180deg, #0E1B30, #0A1322);
    --toastbg: #0E1B30;
    --display: 'Orbitron', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--abyss);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in oklab, var(--sys) 10%, transparent), transparent),
      radial-gradient(ellipse 60% 40% at 90% 110%, color-mix(in oklab, var(--mana) 7%, transparent), transparent);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
    padding-bottom: 90px;
  }
  button { font-family: var(--body); cursor: pointer; }
  input, select, textarea { font-family: var(--body); }
  :focus-visible { outline: 2px solid var(--sys); outline-offset: 2px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }

  /* ---------- Header ---------- */
  header { text-align: center; padding: 10px 0 4px; }
  .sys-tag {
    display: inline-block;
    font-family: var(--display);
    font-size: 10px; font-weight: 700;
    letter-spacing: .35em;
    color: var(--sys);
    border: 1px solid var(--line-glow);
    padding: 4px 12px 3px 15px;
    border-radius: 2px;
    text-transform: uppercase;
    background: color-mix(in oklab, var(--sys) 6%, transparent);
  }
  h1 {
    font-family: var(--display);
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin-top: 8px;
    background: linear-gradient(180deg, var(--logo-top) 30%, var(--sys) 90%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-wrap: balance;
  }
  .week-lead {
    font-size: 14px; color: var(--ink-dim);
    letter-spacing: .06em; margin-top: 2px;
  }
  .week-lead b { color: var(--gold); font-weight: 700; }
  .syncline { font-size: 12px; color: var(--ink-dim); letter-spacing: .08em; margin-top: 4px; text-transform: uppercase; }

  /* ---------- Player cards ---------- */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .hunter {
    position: relative;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-top: 2px solid var(--sys-dim);
    border-radius: 4px;
    padding: 12px 12px 14px;
    overflow: hidden;
  }
  .hunter.leader { border-top-color: var(--gold); }
  .hunter .crown { position: absolute; top: 8px; right: 10px; font-size: 15px; }
  .hunter .face { font-size: 30px; line-height: 1; }
  .hunter .name {
    font-weight: 700; font-size: 17px; letter-spacing: .04em; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rankline { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .rank {
    font-family: var(--display); font-weight: 900; font-size: 22px;
    color: var(--mana);
  }
  .rank.s { color: var(--gold); text-shadow: 0 0 12px color-mix(in oklab, var(--gold) 55%, transparent); }
  .lvl { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--sys); letter-spacing: .1em; }
  .xpbar { height: 7px; background: var(--field); border: 1px solid var(--line); border-radius: 99px; margin-top: 9px; overflow: hidden; }
  .xpbar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--sys-dim), var(--sys));
    box-shadow: 0 0 8px color-mix(in oklab, var(--sys) 70%, transparent);
    border-radius: 99px;
    transition: width .5s ease;
  }
  .xpnums { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .streak { color: var(--high); font-weight: 600; }

  /* ---------- Tabs ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: var(--navbg);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabs { max-width: 640px; margin: 0 auto; display: flex; }
  .tabs button {
    flex: 1; background: none; border: none; color: var(--ink-dim);
    font-size: 9.5px; font-weight: 600; letter-spacing: 0;
    padding: 9px 1px 11px; text-transform: uppercase;
    border-top: 2px solid transparent; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tabs button .ico { display: block; font-size: 18px; margin-bottom: 2px; position: relative; width: fit-content; margin-inline: auto; }
  .tabdot {
    position: absolute; top: -4px; right: -12px;
    background: var(--gold); color: var(--abyss);
    font-size: 10px; font-weight: 700; font-family: var(--body);
    border-radius: 8px; min-width: 15px; height: 15px; line-height: 15px;
    text-align: center; padding: 0 3px;
  }
  .tabs button.on { color: var(--sys); border-top-color: var(--sys); }

  /* ---------- Panels / sections ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 12px;
  }
  h2 {
    font-family: var(--display); font-size: 13px; font-weight: 700;
    letter-spacing: .25em; text-transform: uppercase; color: var(--sys);
    margin-bottom: 12px;
  }
  h2 small { color: var(--ink-dim); letter-spacing: .1em; font-weight: 500; }
  .hint { font-size: 14px; color: var(--ink-dim); }
  .hint.warn { color: var(--high); }

  /* ---------- Quest list ---------- */
  .quest {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-left: 3px solid var(--pcol, var(--sys-dim));
    border-radius: 3px;
    padding: 11px 12px;
    margin-bottom: 9px;
  }
  .quest.bonus { border-color: var(--gold); border-left-color: var(--gold); background: linear-gradient(90deg, color-mix(in oklab, var(--gold) 8%, transparent), var(--panel-2) 55%); }
  .quest .qi { font-size: 24px; }
  .quest .qmain { flex: 1; min-width: 0; }
  .quest .qname { font-weight: 700; font-size: 16.5px; letter-spacing: .02em; }
  .qmeta { display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 2px; border: 1px solid var(--pcol, var(--sys-dim));
    color: var(--pcol, var(--sys));
    background: color-mix(in srgb, var(--pcol, #4DC3FF) 14%, transparent);
  }
  .chip.gold { color: var(--gold); border-color: var(--gold); background: color-mix(in oklab, var(--gold) 10%, transparent); }
  .lastdone { font-size: 12px; color: var(--ink-dim); letter-spacing: .03em; }
  .qbtns { display: flex; gap: 7px; }
  .doer {
    border: 1px solid var(--line-glow); background: color-mix(in oklab, var(--sys) 8%, transparent);
    color: var(--ink); border-radius: 3px;
    font-size: 20px; width: 44px; height: 44px;
    display: grid; place-items: center;
    transition: transform .1s, background .15s;
  }
  .doer:active { transform: scale(.9); background: color-mix(in oklab, var(--sys) 25%, transparent); }

  /* ---------- Duel ---------- */
  .vsrow { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; }
  .vsname { font-weight: 700; width: 30%; }
  .vsname.r { text-align: right; }
  .vs {
    font-family: var(--display); font-weight: 900; color: var(--crit);
    font-size: 15px; letter-spacing: .1em;
  }
  .duelbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); background: var(--field); }
  .duelbar .a { background: linear-gradient(90deg, var(--sys-dim), var(--sys)); transition: width .5s; }
  .duelbar .b { background: linear-gradient(90deg, var(--mana), #6455D6); transition: width .5s; }
  .statgrid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px 14px; font-variant-numeric: tabular-nums; }
  .statgrid .l { text-align: right; font-family: var(--display); font-weight: 700; color: var(--sys); }
  .statgrid .c { text-align: center; color: var(--ink-dim); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; align-self: center; }
  .statgrid .r2 { font-family: var(--display); font-weight: 700; color: var(--mana); }
  .winbadge { text-align: center; margin-top: 14px; font-size: 15px; color: var(--gold); font-weight: 600; letter-spacing: .04em; }

  /* ---------- Graphique & hauts faits ---------- */
  .legend { display: flex; gap: 18px; font-size: 13.5px; color: var(--ink-dim); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  .feathead { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px; margin: 10px 0 7px; }
  .featgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  /* Calendrier d'activité : ramp séquentiel doré sur la variable de champ (suit le thème) */
  .cal { display: flex; flex-direction: column; gap: 3px; }
  .cal-row { display: flex; gap: 3px; align-items: center; }
  .cal-wk { flex: 0 0 46px; font-size: 10.5px; color: var(--ink-dim); text-align: right; padding-right: 5px; }
  .cal-d { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink-dim); }
  .cal-cell { flex: 1; height: 22px; border-radius: 4px; background: var(--field); min-width: 0; }
  .cal-cell[data-lvl="-1"] { background: transparent; border: 1px dashed var(--line); }
  .cal-cell[data-lvl="1"] { background: color-mix(in oklab, var(--gold) 32%, var(--field)); }
  .cal-cell[data-lvl="2"] { background: color-mix(in oklab, var(--gold) 62%, var(--field)); }
  .cal-cell[data-lvl="3"] { background: var(--gold); }
  .cal-cell.today { outline: 2px solid var(--sys); outline-offset: 1px; }
  .cal-legend { display: flex; gap: 5px; align-items: center; justify-content: flex-end; margin-top: 8px; }
  .cal-legend .cal-cell { flex: 0 0 14px; height: 14px; }
  .feat {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; font-size: 12.5px; color: var(--ink-dim);
    opacity: .38; filter: grayscale(.9);
  }
  .feat.on { opacity: 1; filter: none; border-color: var(--line-glow); color: var(--ink); }
  .feat .fi { font-size: 17px; }
  .feat small { line-height: 1.15; }
  .trophyline { display: flex; align-items: center; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .trophyline:last-child { border-bottom: none; }
  .trophyline .tw { color: var(--ink-dim); font-size: 13px; flex: 0 0 92px; }
  .trophyline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trophyline .tscore { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--sys); font-variant-numeric: tabular-nums; }
  .themerow { display: flex; gap: 8px; flex-wrap: wrap; }
  .themebtn {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 3px; padding: 9px 12px; font-size: 14px; font-weight: 600;
  }
  .themebtn i { width: 12px; height: 12px; border-radius: 50%; }
  .themebtn.on { border-color: var(--sys); color: var(--ink); background: rgba(255,255,255,.04); }
  .togglerow { display: flex; align-items: center; gap: 11px; margin-top: 12px; font-size: 14.5px; }
  .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: var(--field); border: 1px solid var(--line);
    border-radius: 99px; transition: background .15s, border-color .15s;
  }
  .switch span::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 50%;
    transform: translateY(-50%); background: var(--ink-dim); border-radius: 50%; transition: transform .15s, background .15s;
  }
  .switch input:checked + span { background: color-mix(in oklab, var(--sys) 18%, transparent); border-color: var(--sys); }
  .switch input:checked + span::before { transform: translate(18px, -50%); background: var(--sys); }
  .switch input:focus-visible + span { outline: 2px solid var(--sys); outline-offset: 2px; }
  .suggested { border-left-color: var(--gold) !important; }
  .suggested .qname::after { content: " 👉"; }
  .betremind {
    display: flex; align-items: center; gap: 8px;
    background: color-mix(in oklab, var(--gold) 8%, transparent); border: 1px solid var(--gold); border-radius: 3px;
    padding: 9px 12px; margin-bottom: 12px; font-size: 14px; color: var(--ink);
  }
  .daystat {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    background: color-mix(in oklab, var(--sys) 8%, transparent); border: 1px solid var(--line-glow);
    border-radius: 3px; padding: 8px 12px; margin-bottom: 12px; font-size: 14px; color: var(--ink);
  }
  .daystat-by { margin-left: auto; font-size: 13px; color: var(--ink-dim); }
  .uvcount { font-size: 12px; color: var(--ink-dim); font-weight: 400; }
  .betline { font-size: 15px; padding: 4px 0 10px; border-bottom: 1px dashed var(--line); margin-bottom: 8px; }
  .betline:last-child { border-bottom: none; margin-bottom: 0; }
  .betline.hot { border: 1px solid var(--gold); border-radius: 3px; padding: 10px 12px; background: color-mix(in oklab, var(--gold) 7%, transparent); }
  .splitline { display: flex; align-items: center; gap: 9px; padding: 7px 0 4px; font-size: 14.5px; }
  .splitcounts { font-family: var(--display); font-size: 12px; font-weight: 700; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .splitbar { display: flex; height: 5px; border-radius: 99px; overflow: hidden; background: var(--field); margin-bottom: 9px; }
  .splitbar i { display: block; height: 100%; }
  .panelhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .linkbtn {
    background: none; border: none; color: var(--sys); font-size: 12.5px; font-weight: 700;
    letter-spacing: .04em; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; flex: 0 0 auto;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .tblwrap { overflow-x: auto; }
  .datatable { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .datatable th, .datatable td { text-align: right; padding: 6px 8px; border-bottom: 1px dashed var(--line); }
  .datatable th[scope="row"] { text-align: left; color: var(--ink-dim); font-weight: 500; }
  .datatable thead th { color: var(--sys); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  .datatable thead th:first-child { text-align: left; }
  .evremind {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: color-mix(in oklab, var(--mana) 8%, transparent); border: 1px solid var(--mana); border-radius: 3px;
    padding: 9px 12px; margin-bottom: 12px; font-size: 14px; color: var(--ink);
  }
  .evremind button { background: none; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; font-size: 12px; padding: 5px 10px; }
  .filterrow { display: flex; gap: 7px; flex-wrap: wrap; }
  .filterbtn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 99px; padding: 6px 13px; font-size: 13px; font-weight: 600;
  }
  .filterbtn.on { border-color: var(--sys); color: var(--ink); background: rgba(255,255,255,.04); }
  .notifhist { margin: 10px 0 4px; }
  .notifhistline {
    display: flex; align-items: center; gap: 8px; padding: 5px 0;
    border-bottom: 1px dashed var(--line); font-size: 13px; color: var(--ink-dim);
  }
  .notifhistline:last-child { border-bottom: none; }
  .notifhistline .hint { font-size: 12px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

  /* ---------- Héros ---------- */
  .charline { font-size: 12.5px; color: var(--gold); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rarity {
    font-family: var(--display); font-size: 11px; font-weight: 900; letter-spacing: .06em;
    color: var(--rcol, var(--sys)); border: 1px solid var(--rcol, var(--sys));
    border-radius: 2px; padding: 1px 6px;
    background: color-mix(in srgb, var(--rcol, #4DC3FF) 14%, transparent);
  }
  .curchar {
    display: flex; gap: 13px; align-items: flex-start;
    border: 1px solid var(--rcol, var(--line)); border-radius: 3px;
    background: var(--panel-2); padding: 12px;
  }
  .curchar-emoji { font-size: 44px; line-height: 1; }
  .curchar-name { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .gearline { display: flex; flex-direction: column; gap: 2px; margin: 7px 0 5px; }
  .gearstep { font-size: 13px; color: var(--ink-dim); }
  .gearstep.on { color: var(--ink); }
  .chargrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .charcard {
    background: var(--panel-2); border: 1px solid var(--line); border-top: 2px solid var(--rcol, var(--line));
    border-radius: 3px; padding: 10px; display: flex; flex-direction: column; gap: 5px;
  }
  .charcard.locked { opacity: .5; filter: grayscale(.55); }
  .charcard.current { border-color: var(--rcol); box-shadow: 0 0 10px color-mix(in srgb, var(--rcol) 35%, transparent); }
  .charcard-top { display: flex; justify-content: space-between; align-items: center; }
  .charcard-emoji { font-size: 30px; line-height: 1; }
  .charcard-name { font-weight: 700; font-size: 15px; }
  .charcard-cond { font-size: 12px; color: var(--ink-dim); line-height: 1.3; }
  .charcard-cond .condok { color: var(--rcol); font-weight: 600; }
  .charcard-btn { padding: 6px 10px; font-size: 12.5px; margin-top: 2px; }
  .charcard-cur { font-size: 13px; color: var(--gold); font-weight: 700; }

  /* ---------- Objectives ---------- */
  .obj { border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); padding: 12px; margin-bottom: 10px; }
  .obj .oname { font-weight: 700; font-size: 16.5px; }
  .obj .oreward { font-size: 14px; color: var(--gold); margin-top: 1px; }
  .obj .obar { height: 9px; background: var(--field); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-top: 9px; }
  .obj .obar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mana), var(--sys)); border-radius: 99px; transition: width .5s; }
  .obj .onums { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .obj.done { border-color: var(--gold); }
  .claim {
    width: 100%; margin-top: 10px;
    background: linear-gradient(180deg, #F5D77A, var(--gold));
    color: #201800; font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    border: none; border-radius: 3px; padding: 10px;
  }
  .wonline { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .wonline:last-child { border-bottom: none; }
  .wonline .d { color: var(--ink-dim); font-size: 13px; }

  /* ---------- Journal ---------- */

  .undo { background: none; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 3px; font-size: 13px; padding: 7px 12px; }
  .notebtn { background: none; border: none; color: var(--ink-dim); font-size: 14px; padding: 4px 6px; opacity: .7; }
  .notebtn:hover { opacity: 1; }
  .jnote-edit { flex: 1; min-width: 60px; max-width: 160px; padding: 4px 7px; font-size: 13px; }

  /* ---------- Forms ---------- */
  .frow { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .frow > * { flex: 1; }
  input[type=text], input[type=number], select {
    background: var(--field); border: 1px solid var(--line); color: var(--ink);

  }
  .btn {
    background: color-mix(in oklab, var(--sys) 12%, transparent); border: 1px solid var(--line-glow); color: var(--sys);
    border-radius: 3px; padding: 9px 14px; font-weight: 700; font-size: 14px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .btn.ghost { background: none; color: var(--ink-dim); border-color: var(--line); }
  .btn.danger { color: var(--crit); border-color: #5A2430; background: rgba(255,92,110,.08); }
  .mgline { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .mgline select { padding-left: 6px; padding-right: 4px; }
  .mgline input[data-ticon] { text-align: center; padding-left: 4px; padding-right: 4px; }
  .mgline:last-child { border-bottom: none; }
  .mgline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { background: none; border: none; color: var(--crit); font-size: 17px; padding: 2px 6px; }

  /* ---------- System notification modal ---------- */
  .veil {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(3,6,12,.75); backdrop-filter: blur(3px);
    display: grid; place-items: center; padding: 24px;
  }
  .sysbox {
    width: 100%; max-width: 380px;
    background: var(--modalbg);
    border: 1px solid var(--sys);
    box-shadow: 0 0 30px color-mix(in oklab, var(--sys) 35%, transparent), inset 0 0 25px color-mix(in oklab, var(--sys) 6%, transparent);
    border-radius: 3px;
    padding: 22px 20px 20px;
    text-align: center;
    animation: sysin .35s ease;
  }
  @keyframes sysin { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sysbox .bang {
    font-family: var(--display); font-weight: 900; letter-spacing: .3em;
    color: var(--sys); font-size: 12px; text-transform: uppercase;
  }
  .sysbox .bang::before, .sysbox .bang::after { content: " ‼ "; color: var(--crit); }
  .sysbox .big { font-family: var(--display); font-weight: 900; font-size: 26px; margin: 12px 0 4px; letter-spacing: .06em; }
  .sysbox .sub { color: var(--ink-dim); font-size: 15px; }
  .sysbox .gold { color: var(--gold); }
  .sysbox button { margin-top: 16px; }

  /* toast */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--toastbg); border: 1px solid var(--sys-dim); color: var(--ink);
    padding: 8px 16px; border-radius: 3px; font-size: 15px; z-index: 60;
    box-shadow: 0 0 14px color-mix(in oklab, var(--sys) 30%, transparent);
    animation: toastin .25s ease;
    white-space: nowrap;
    display: flex; align-items: center; gap: 12px;
  }
  .toast-action {
    background: none; border: 1px solid var(--line-glow); color: var(--sys);
    border-radius: 3px; font-size: 13px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; padding: 3px 10px;
  }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (min-width: 560px) { .quest .qname { font-size: 17.5px; } }
</style>

<body>
<div class="wrap">
  <header>
    <span class="sys-tag">Système</span>

  </header>

  <div class="duo" id="duo"></div>

<nav>

<div id="modal"></div>
<div id="toastZone" aria-live="polite"></div>

<script>
"use strict";

/* ================= State ================= */
const KEY = "rangement-sl-v2";
const PRIOS = {
  basse:    { label: "Basse",    xp: 10, col: "var(--prio-basse)" },
  normale:  { label: "Normale",  xp: 20, col: "var(--prio-normale)" },
  haute:    { label: "Haute",    xp: 35, col: "var(--high)" },
  critique: { label: "Critique", xp: 50, col: "var(--crit)" },
};
const uid = () => Math.random().toString(36).slice(2, 10);

function defaultState() {
  return {
    players: [
      { id: "p1", name: "Chasseur", emoji: "⚔️", color: "#4DC3FF", characterId: null },
      { id: "p2", name: "Chasseuse", emoji: "🏹", color: "#8B7BFF", characterId: null },
    ],
    tasks: [
      { id: uid(), name: "Vaisselle / lave-vaisselle", icon: "🍽️", prio: "normale" },
      { id: uid(), name: "Aspirateur", icon: "🧹", prio: "normale" },
      { id: uid(), name: "Salle de bain", icon: "🛁", prio: "haute" },
      { id: uid(), name: "Sortir les poubelles", icon: "🗑️", prio: "basse" },
      { id: uid(), name: "Lessive", icon: "👕", prio: "normale" },
      { id: uid(), name: "Étendre / plier le linge", icon: "🧺", prio: "normale" },
      { id: uid(), name: "Cuisine & plans de travail", icon: "🍳", prio: "normale" },
      { id: uid(), name: "Serpillière / sols", icon: "🧽", prio: "haute" },
      { id: uid(), name: "Ranger le salon", icon: "🛋️", prio: "basse" },
      { id: uid(), name: "Changer les draps", icon: "🛏️", prio: "haute" },
      { id: uid(), name: "Courses", icon: "🛒", prio: "normale" },
      { id: uid(), name: "Nettoyer le frigo", icon: "🧊", prio: "critique" },
      { id: uid(), name: "Vitres", icon: "🪟", prio: "critique" },
    ],
    rewards: [
      { id: uid(), name: "Séance de ciné", icon: "🎬" },
      { id: uid(), name: "Uber Eats au choix", icon: "🍔" },
      { id: uid(), name: "Journée Calicéo", icon: "💆" },
      { id: uid(), name: "Resto en amoureux", icon: "🍝" },
      { id: uid(), name: "Grasse matinée protégée", icon: "😴" },
    ],
    objectives: [],
    won: [],   // { id, name, icon, ts }
    log: [],   // { id, ts, playerId, taskName, icon, xp, note }
    bets: [],  // { id, week, rewardId, createdAt, claimed }
  };
}

/* ================= Synchronisation (Supabase) =================
   L'état de référence vit dans la base partagée ; chaque téléphone garde
   une copie locale (cache) et une file d'actions à envoyer (mode hors ligne). */
const SUPA_URL = "https://vnisnfjfnxrjuxwgwibs.supabase.co";
const SUPA_KEY = "sb_publishable_X9VC-plIXr3Xs26wYtVA0g_YhYW_WoG";
const sb = (typeof window.supabase !== "undefined")
  ? window.supabase.createClient(SUPA_URL, SUPA_KEY)
  : null;

let S, PENDING = [];
(function initFromCache() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw && raw.S) {
      S = Object.assign(defaultState(), raw.S);
      PENDING = raw.pending || [];
      return;
    }
  } catch (e) { /* cache corrompu -> repart de zéro */ }
  S = defaultState();
  if (!sb) {
    S.objectives.push({
      id: uid(), name: "Semaine de choc", type: "xp", target: 300,
      rewardId: S.rewards[0].id, createdAt: Date.now(), claimed: false,
    });
  }
})();
function save() { localStorage.setItem(KEY, JSON.stringify({ S, pending: PENDING })); }

/* --- correspondance lignes SQL <-> état de l'appli --- */
const fromRow = {
  players: r => ({ id: r.id, name: r.name, emoji: r.emoji, color: r.color || "#4DC3FF", characterId: r.character_id || null }),
  tasks: r => ({ id: r.id, name: r.name, icon: r.icon, prio: r.prio, createdAt: Number(r.created_at) }),
  rewards: r => ({ id: r.id, name: r.name, icon: r.icon }),
  objectives: r => ({ id: r.id, name: r.name, type: r.type, target: r.target, rewardId: r.reward_id, createdAt: Number(r.created_at), claimed: r.claimed }),
  log: r => ({ id: r.id, ts: Number(r.ts), playerId: r.player_id, taskName: r.task_name, icon: r.icon, xp: r.xp, note: r.note || "" }),
  won: r => ({ id: r.id, name: r.name, icon: r.icon, ts: Number(r.ts) }),
  bets: r => ({ id: r.id, week: r.week, rewardId: r.reward_id, createdAt: Number(r.created_at), claimed: r.claimed }),
};
const toRow = {
  players: p => ({ id: p.id, name: p.name, emoji: p.emoji, color: p.color || "#4DC3FF", character_id: p.characterId || null }),
  tasks: t => ({ id: t.id, name: t.name, icon: t.icon, prio: t.prio, created_at: t.createdAt || Date.now() }),
  rewards: r => ({ id: r.id, name: r.name, icon: r.icon }),
  objectives: o => ({ id: o.id, name: o.name, type: o.type, target: o.target, reward_id: o.rewardId, created_at: o.createdAt, claimed: o.claimed }),
  log: l => ({ id: l.id, ts: l.ts, player_id: l.playerId, task_name: l.taskName, icon: l.icon, xp: l.xp, note: l.note || "" }),
  won: w => ({ id: w.id, name: w.name, icon: w.icon, ts: w.ts }),
  bets: b => ({ id: b.id, week: b.week, reward_id: b.rewardId, created_at: b.createdAt, claimed: b.claimed }),
};
const TABLES = ["players", "tasks", "rewards", "objectives", "log", "won", "bets"];

/* --- file d'actions : envoyées tout de suite si possible, sinon plus tard --- */
let FLUSHING = false;
function queueOp(op) { PENDING.push(op); save(); flushOps(); renderSync(); }
async function flushOps() {
  if (!sb || FLUSHING) return;
  FLUSHING = true;
  while (PENDING.length) {
    const op = PENDING[0];
    try {
      let res;
      if (op.type === "upsert") res = await sb.from(op.table).upsert(op.row);
      else if (op.type === "delete") res = await sb.from(op.table).delete().eq("id", op.id);
      else if (op.type === "clear") res = await sb.from(op.table).delete().neq("id", "");
      if (res && res.error) throw res.error;
      PENDING.shift(); save();
    } catch (e) { break; /* hors ligne : on réessaiera */ }
  }
  FLUSHING = false;
  renderSync();
}
function applyPending(state) {
  for (const op of PENDING) {
    const coll = state[op.table];
    if (!coll) continue;
    if (op.type === "upsert") {
      const item = fromRow[op.table](op.row);
      const i = coll.findIndex(x => x.id === item.id);
      if (i >= 0) coll[i] = item; else coll.push(item);
    } else if (op.type === "delete") {
      state[op.table] = coll.filter(x => x.id !== op.id);
    } else if (op.type === "clear") {
      state[op.table] = [];
    }
  }
  return state;
}

let SYNCED = false;
async function loadRemote() {
  if (!sb) return;
  try {
    const res = await Promise.all([
      sb.from("players").select("*").order("id"),
      sb.from("tasks").select("*").order("created_at").order("id"),
      sb.from("rewards").select("*").order("id"),
      sb.from("objectives").select("*").order("created_at"),
      sb.from("log").select("*").order("ts"),
      sb.from("won").select("*").order("ts"),
      sb.from("bets").select("*").order("created_at"),
    ]);
    for (const r of res) if (r.error) throw r.error;
    const fresh = { players: [], tasks: [], rewards: [], objectives: [], log: [], won: [], bets: [] };
    TABLES.forEach((n, i) => { fresh[n] = res[i].data.map(fromRow[n]); });
    if (fresh.players.length < 2) fresh.players = defaultState().players;
    S = applyPending(fresh);
    SYNCED = true;
    applyStreakShields();
    save(); scheduleRender();
  } catch (e) { SYNCED = false; }
  renderSync();
}

/* --- rendu différé si l'utilisateur est en train de taper --- */
let RENDER_DIRTY = false;
function isTyping() {
  const a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA");
}
function scheduleRender() {
  if (isTyping()) { RENDER_DIRTY = true; return; }
  render();
}
document.addEventListener("focusout", () => {
  setTimeout(() => {
    if (RENDER_DIRTY && !isTyping()) { RENDER_DIRTY = false; render(); }
  }, 50);
});

function renderSync() {
  const el = $("#sync");
  if (!el) return;
  if (!sb) { el.textContent = "⛔ mode local — synchro indisponible"; return; }
  if (PENDING.length) el.textContent = "⏳ " + PENDING.length + " action(s) à synchroniser";
  else if (SYNCED) el.textContent = "☁️ synchronisé";
  else el.textContent = "📴 hors ligne — synchro à la reconnexion";
}

/* --- temps réel : toute action de l'autre téléphone rafraîchit l'écran --- */
let rtTimer = null;
if (sb) {
  sb.channel("rangement-sync")
    .on("postgres_changes", { event: "*", schema: "public" }, () => {
      clearTimeout(rtTimer);
      rtTimer = setTimeout(loadRemote, 400);
    })
    .subscribe();
  window.addEventListener("online", () => { flushOps(); loadRemote(); });
  setInterval(flushOps, 15000);
}

/* ================= Time helpers ================= */
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
function weekKey(ts) {
  const d = new Date(ts); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // lundi
  return dayKey(d.getTime());
}
const monthKey = ts => dayKey(ts).slice(0, 7);
const NOW = () => Date.now();

/* ================= Derived stats ================= */
function xpOf(pid, filter) {
  return S.log.reduce((a, l) => a + ((l.playerId === pid && (!filter || filter(l))) ? l.xp : 0), 0);
}
function totalXp(pid) { return xpOf(pid); }
function weekXp(pid) { const wk = weekKey(NOW()); return xpOf(pid, l => weekKey(l.ts) === wk); }
function monthXp(pid) { const mk = monthKey(NOW()); return xpOf(pid, l => monthKey(l.ts) === mk); }
function taskCount(pid, filter) { return S.log.filter(l => l.playerId === pid && (!filter || filter(l))).length; }

// Niveau : chaque niveau N -> N+1 coûte 100 + 30*(N-1) XP
function levelInfo(xp) {
  let lvl = 1, need = 100, rest = xp;
  while (rest >= need) { rest -= need; lvl++; need = 100 + 30 * (lvl - 1); }
  return { lvl, into: rest, need };
}
function rankOf(lvl) {
  if (lvl >= 50) return { r: "MONARQUE", s: true };
  if (lvl >= 30) return { r: "S", s: true };
  if (lvl >= 20) return { r: "A", s: false };
  if (lvl >= 15) return { r: "B", s: false };
  if (lvl >= 10) return { r: "C", s: false };
  if (lvl >= 5)  return { r: "D", s: false };
  return { r: "E", s: false };
}
// Série : jours consécutifs (finissant aujourd'hui ou hier) avec >= 1 tâche
function streakOf(pid) {
  const days = new Set(S.log.filter(l => l.playerId === pid).map(l => dayKey(l.ts)));
  let n = 0;
  const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1); // série encore vivante si tâche hier
  while (days.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function streakMult(pid) { return 1 + Math.min(streakOf(pid), 10) * 0.05; } // +5%/jour, max +50%

/* --- Bouclier de série façon Duolingo : dérivé du journal, zéro nouvelle colonne ---
   Un bouclier est gagné automatiquement tous les 7 jours consécutifs de série réelle
   (hors jours déjà couverts par un bouclier). Un log { note: "bouclier", xp: 0 } marque
   un jour comblé — il compte pour streakOf() mais pas pour en gagner un nouveau. */
function shieldDayKeys(pid) {
  return new Set(S.log.filter(l => l.playerId === pid && l.note === "bouclier").map(l => dayKey(l.ts)));
}
function earnedShields(pid) {
  const shielded = shieldDayKeys(pid);
  const days = [...new Set(S.log.filter(l => l.playerId === pid).map(l => dayKey(l.ts)))]
    .filter(k => !shielded.has(k)).sort();
  let earned = 0, run = 0, prev = null;
  for (const k of days) {
    const d = new Date(k + "T00:00:00");
    run = (prev !== null && Math.round((d - prev) / 86400000) === 1) ? run + 1 : 1;
    if (run % 7 === 0) earned++;
    prev = d;
  }
  return earned;
}
function usedShields(pid) { return shieldDayKeys(pid).size; }
function availableShields(pid) { return Math.max(0, earnedShields(pid) - usedShields(pid)); }
// Comble automatiquement UNE journée manquée (hier) si la série était vivante avant-hier
// et qu'un bouclier est disponible. Idempotent entre les deux téléphones (id déterministe).
function applyStreakShields() {
  const yKey = dayKey(NOW() - 864e5), twoKey = dayKey(NOW() - 2 * 864e5);
  let changed = false;
  S.players.forEach(p => {
    const hasYesterday = S.log.some(l => l.playerId === p.id && dayKey(l.ts) === yKey);
    const hasTwoAgo = S.log.some(l => l.playerId === p.id && dayKey(l.ts) === twoKey);
    if (hasYesterday || !hasTwoAgo || availableShields(p.id) <= 0) return;
    const id = "shield-" + p.id + "-" + yKey;
    if (S.log.some(l => l.id === id)) return;
    const entry = { id, ts: new Date(yKey + "T20:00:00").getTime(), playerId: p.id, taskName: "Bouclier de série", icon: "🛡️", xp: 0, note: "bouclier" };
    S.log.push(entry);
    queueOp({ table: "log", type: "upsert", row: toRow.log(entry) });
    changed = true;
    toast(`🛡️ Bouclier de série activé pour ${p.name} — série préservée !`);
  });
  if (changed) save();
  return changed;
}

// Tâche bonus du jour (déterministe à partir de la date)
function bonusTaskId() {
  if (!S.tasks.length) return null;
  const k = dayKey(NOW());
  let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return S.tasks[h % S.tasks.length].id;
}

/* --- Hauts faits (badges), calculés à partir du journal --- */
const FEATS = [
  { id: "q1",   icon: "🗡️", name: "Première quête",              test: st => st.count >= 1 },
  { id: "q10",  icon: "⚔️", name: "10 quêtes",                    test: st => st.count >= 10 },
  { id: "q50",  icon: "🛡️", name: "50 quêtes",                    test: st => st.count >= 50 },
  { id: "q100", icon: "👑", name: "100 quêtes",                   test: st => st.count >= 100 },
  { id: "s3",   icon: "🔥", name: "Série de 3 jours",             test: st => st.bestStreak >= 3 },
  { id: "s7",   icon: "🌋", name: "Série de 7 jours",             test: st => st.bestStreak >= 7 },
  { id: "s14",  icon: "☄️", name: "Série de 14 jours",            test: st => st.bestStreak >= 14 },
  { id: "rd",   icon: "🥉", name: "Rang D (niveau 5)",            test: st => st.lvl >= 5 },
  { id: "rc",   icon: "🥈", name: "Rang C (niveau 10)",           test: st => st.lvl >= 10 },
  { id: "ra",   icon: "🥇", name: "Rang A (niveau 20)",           test: st => st.lvl >= 20 },
  { id: "rs",   icon: "🌟", name: "Rang S (niveau 30)",           test: st => st.lvl >= 30 },
  { id: "xp1k", icon: "💎", name: "1 000 XP au total",            test: st => st.xp >= 1000 },
  { id: "big5", icon: "💥", name: "5 grosses quêtes (50+ XP)",    test: st => st.big >= 5 },
  { id: "sun",  icon: "🌅", name: "Lève-tôt (quête avant 8 h)",   test: st => st.early },
  { id: "moon", icon: "🌙", name: "Oiseau de nuit (après 22 h)",  test: st => st.night },
  { id: "hero1",  icon: "🎴", name: "Premier héros débloqué",     test: st => st.heroes >= 1 },
  { id: "hero5",  icon: "🎭", name: "5 héros débloqués",          test: st => st.heroes >= 5 },
  { id: "heroH",  icon: "🌌", name: "Moitié du panthéon",         test: st => st.heroes >= Math.ceil(CHARACTERS.length / 2) },
  { id: "soul",   icon: "🧬", name: "Âme liée (héros incarné)",   test: st => st.embodied },
];
function bestStreakOf(pid) {
  const days = [...new Set(S.log.filter(l => l.playerId === pid).map(l => dayKey(l.ts)))].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) {
    if (prev) {
      const nd = new Date(prev + "T12:00"); nd.setDate(nd.getDate() + 1);
      run = dayKey(nd.getTime()) === d ? run + 1 : 1;
    } else run = 1;
    best = Math.max(best, run); prev = d;
  }
  return best;
}

function condMet(cond, st) {
  return (!cond.lvl || st.lvl >= cond.lvl)
    && (!cond.count || st.count >= cond.count)
    && (!cond.streak || st.streak >= cond.streak)
    && (!cond.trophies || st.trophies >= cond.trophies);
}
function condText(cond) {
  const parts = [];
  if (cond.lvl) parts.push("niv. " + cond.lvl);
  if (cond.count) parts.push(cond.count + " quêtes");
  if (cond.streak) parts.push("série " + cond.streak + " j");
  if (cond.trophies) parts.push(cond.trophies + " trophée" + (cond.trophies > 1 ? "s" : ""));
  return parts.join(" · ");
}
// Version avec progression : « niv. 8/13 · 20/35 quêtes », les critères atteints cochés ✓
function condProgress(cond, st) {
  const seg = (cur, need, curTxt, okTxt) => cur >= need
    ? `<span class="condok">${okTxt} ✓</span>` : curTxt;
  const parts = [];
  if (cond.lvl) parts.push(seg(st.lvl, cond.lvl, `niv. ${st.lvl}/${cond.lvl}`, `niv. ${cond.lvl}`));
  if (cond.count) parts.push(seg(st.count, cond.count, `${st.count}/${cond.count} quêtes`, `${cond.count} quêtes`));
  if (cond.streak) parts.push(seg(st.streak, cond.streak, `série ${st.streak}/${cond.streak} j`, `série ${cond.streak} j`));
  if (cond.trophies) { const s = cond.trophies > 1 ? "s" : ""; parts.push(seg(st.trophies, cond.trophies, `${st.trophies}/${cond.trophies} trophée${s}`, `${cond.trophies} trophée${s}`)); }
  return parts.join(" · ");
}
function unlockedCharIds(pid) {
  const st = charStats(pid);
  return CHARACTERS.filter(c => condMet(c.cond, st)).map(c => c.id);
}
// Héros verrouillé le plus proche du déblocage (moyenne des ratios critère par critère)
function nextHeroFor(pid, universe) {
  const st = charStats(pid);
  const pool = universe ? CHARACTERS.filter(c => c.univers === universe) : CHARACTERS;
  const locked = pool.filter(c => !condMet(c.cond, st));
  if (!locked.length) return null;
  const score = c => {
    let s = 0, n = 0;
    for (const k of ["lvl", "count", "streak", "trophies"]) {
      if (c.cond[k]) { s += Math.min(st[k] / c.cond[k], 1); n++; }
    }
    return s / n;
  };
  return locked.reduce((a, b) => (score(b) > score(a) ? b : a));
}

function bindEnter(ids, btn) {

    if (el) el.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); btn && btn.click(); } };
  });

// Entrée = valide (comme la note du Journal) sur les champs d'édition en place ;
// Échap = annule et restaure la valeur d'origine, sans déclencher l'onchange.
function bindEnterCommit(selector) {
  document.querySelectorAll(selector).forEach(inp => {
    const orig = inp.value;
    inp.onkeydown = e => {
      if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
      else if (e.key === "Escape") { e.preventDefault(); inp.value = orig; inp.blur(); }
    };
  });
}

    return risky.map(p => `${p.name} : série de ${streakOf(p.id)} jour(s) en jeu`).join(" · ");
  }
  return "Personne n'a encore chassé aujourd'hui.";
}

/* --- Notification navigateur (best-effort, en plus du rappel dans l'appli) --- */
function notifsSupported() { return typeof Notification !== "undefined"; }
function notifsOn() { return notifsSupported() && localStorage.getItem("rangement-notifs") === "on"; }
function notifiedToday() { return localStorage.getItem("rangement-notif-sent") === dayKey(NOW()); }
function markNotifiedToday() { localStorage.setItem("rangement-notif-sent", dayKey(NOW())); }
function notifHistory() {
  try { return JSON.parse(localStorage.getItem("rangement-notif-log") || "[]"); } catch (e) { return []; }
}
function pushNotifHistory(body) {
  const h = notifHistory();
  h.push({ ts: NOW(), body });
  localStorage.setItem("rangement-notif-log", JSON.stringify(h.slice(-14)));
}
async function sendBrowserNotification(title, body, tag) {
  let sent = false;
  try {
    const reg = navigator.serviceWorker && (await navigator.serviceWorker.getRegistration());
    if (reg && reg.showNotification) {
      await reg.showNotification(title, { body, icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag });
      sent = true;
    }
  } catch (e) { /* pas de service worker actif -> repli sur Notification() */ }
  if (!sent) {
    try { new Notification(title, { body, icon: "icons/icon-192.png" }); sent = true; }
    catch (e) { /* notification indisponible sur cet appareil, tant pis */ }
  }
  return sent;
}
async function maybeSendStreakNotification() {
  if (!notifsOn() || notifiedToday() || Notification.permission !== "granted" || !shouldShowEveningReminder()) return;
  const body = eveningReminderTextPlain();
  const sent = await sendBrowserNotification("⚔️ Rangement — ne perds pas ta série !", body, "rangement-streak");
  if (sent) { markNotifiedToday(); pushNotifHistory(body); }
}
// Test manuel depuis Réglages : vérifie tout de suite que le navigateur autorise bien l'envoi.
async function sendTestNotification() {
  if (!notifsSupported() || Notification.permission !== "granted") {
    toast("Autorisation refusée — active la notification d'abord");
    return;
  }
  const sent = await sendBrowserNotification("⚔️ Rangement — test", "Ceci est une notification de test.", "rangement-test");
  if (sent) { pushNotifHistory("🧪 Test : notification envoyée avec succès"); toast("Notification de test envoyée"); render(); }
  else toast("Échec de l'envoi — vérifie les réglages du navigateur");
}

/* --- Rappels vivants : jusqu'ici tout n'était évalué qu'au chargement ou lors d'un
   render ; si l'appli restait ouverte (tablette posée, onglet du soir), le bandeau du
   rappel et la notification n'apparaissaient jamais. Un tick par minute suffit. --- */
let LAST_REMIND_STATE = null;
function reminderTick() {
  const due = shouldShowEveningReminder();
  if (LAST_REMIND_STATE !== null && due !== LAST_REMIND_STATE && TAB === "quetes") scheduleRender();
  LAST_REMIND_STATE = due;
  maybeSendStreakNotification();
  // Comme le bandeau du soir : le récap du dimanche doit apparaître même si l'appli
  // était déjà ouverte avant 18h, sans attendre un rechargement (jamais si une modale
  // système est déjà affichée, pour ne pas interrompre une chaîne de jalons en cours).
  if (shouldShowWeeklyRecap() && !document.querySelector(".veil")) weeklyRecapModal();
  return due;
}

// Tâche la plus "en retard" : jamais faite, sinon faite il y a le plus longtemps.
function overdueTaskId() {
  if (!S.tasks.length) return null;
  let best = null, bestTs = Infinity;
  for (const t of S.tasks) {
    const last = [...S.log].reverse().find(l => l.taskName === t.name);
    const ts = last ? last.ts : -Infinity; // jamais faite = priorité maximale
    if (ts < bestTs) { bestTs = ts; best = t.id; }
  }
  return best;
}

/* ---------- Duel ---------- */
function trophyData() {
  const [a, b] = S.players;
  const cur = weekKey(NOW());
  const byWeek = {};
  for (const l of S.log) {
    const wk = weekKey(l.ts);
    if (wk === cur) continue;
    (byWeek[wk] ??= { a: 0, b: 0 })[l.playerId === a.id ? "a" : "b"] += l.xp;
  }
  let winsA = 0, winsB = 0;
  for (const wk in byWeek) {
    if (byWeek[wk].a > byWeek[wk].b) winsA++;
    else if (byWeek[wk].b > byWeek[wk].a) winsB++;
  }
  // Série de victoires hebdo en cours : semaines écoulées consécutives (les plus
  // récentes d'abord) remportées par le même joueur, stoppée à la première égalité/défaite.
  let streakHolder = null, streakLen = 0;
  for (const wk of Object.keys(byWeek).sort().reverse()) {
    const x = byWeek[wk];
    if (x.a === x.b) break;
    const w = x.a > x.b ? "a" : "b";
    if (streakHolder === null) streakHolder = w;
    if (w !== streakHolder) break;
    streakLen++;
  }
  return { byWeek, winsA, winsB, streakA: streakHolder === "a" ? streakLen : 0, streakB: streakHolder === "b" ? streakLen : 0 };
}

function trophyWall(byWeek) {
  const [a, b] = S.players;
  const weeks = Object.keys(byWeek).sort().reverse().slice(0, 12);
  if (!weeks.length) return '<p class="hint">Le premier trophée sera décerné à la fin de cette semaine. Que la chasse commence ! 👑</p>';
  return weeks.map(wk => {
    const x = byWeek[wk];
    const d = new Date(wk + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    const win = x.a === x.b ? null : (x.a > x.b ? a : b);
    return `<div class="trophyline">
      <span class="tw">Sem. du ${d}</span>
      <span class="grow">${win ? "👑 " + esc(win.emoji + " " + win.name) : "⚡ Égalité"}</span>
      <span class="tscore">${x.a} – ${x.b}</span>
    </div>`;
  }).join("");
}

function weekChart() {

  const W = 320, H = 112, base = H - 14, plot = H - 22, gw = W / 8, bw = 13;
  const grid = [0.5, 1].map(f => {

            `<rect x="${(cx + 1).toFixed(1)}" y="${base - hb}" width="${bw}" height="${hb}" rx="2" fill="${esc(b.color)}"><title>${esc(b.name)} · ${x.b} XP</title></rect>`;

function taskSplit() {

    const countFor = pid => S.log.filter(l => l.taskName === t.name && l.playerId === pid).length;
    const ca = countFor(a.id), cb = countFor(b.id), total = ca + cb;
    return { t, ca, cb, total };
  }).filter(x => x.total > 0).sort((x, y) => y.total - x.total);
  if (!counts.length) return '<p class="hint">Accomplissez quelques quêtes pour voir la répartition apparaître ici.</p>';
  return counts.map(({ t, ca, cb, total }) => {
    const pa = Math.round(100 * ca / total);

    return `

/* --- Calendrier d'activité (8 dernières semaines, dérivé du journal, zéro stockage) --- */
function activityDays() {
  const WEEKS = 8;
  const counts = {};
  for (const l of S.log) {
    if (l.note === "bouclier") continue;
    const k = dayKey(l.ts);
    (counts[k] ??= { total: 0, byP: {} });
    counts[k].total++;
    counts[k].byP[l.playerId] = (counts[k].byP[l.playerId] || 0) + 1;
  }
  const monday = new Date(); monday.setHours(0, 0, 0, 0);
  monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7)); // lundi de la semaine en cours
  const todayK = dayKey(NOW());
  const days = [];
  for (let w = WEEKS - 1; w >= 0; w--) {
    const start = new Date(monday); start.setDate(start.getDate() - w * 7);
    for (let d = 0; d < 7; d++) {
      const day = new Date(start); day.setDate(start.getDate() + d);
      const k = dayKey(day.getTime());
      const c = counts[k];
      const n = c ? c.total : 0;
      const lvl = day.getTime() > NOW() ? -1 : n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : 3;
      const label = day.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
      const det = c ? S.players.map(p => c.byP[p.id] ? `${p.emoji} ${c.byP[p.id]}` : "").filter(Boolean).join(" · ") : "";
      days.push({ weekStart: start, lvl, n, label, det, today: k === todayK });
    }
  }
  return { WEEKS, days };
}

    ["Boucliers 🛡️ disponibles", availableShields(a.id), availableShields(b.id), ""],
    ["Trophées 👑", trophies.winsA, trophies.winsB, ""],
    ["Série de victoires 🔥", trophies.streakA, trophies.streakB, " sem."],
  ];
  const wa = weekXp(a.id), wb = weekXp(b.id), tot = wa + wb;
  const pa = tot ? Math.round(100 * wa / tot) : 50;
  const lead = wa === wb ? null : (wa > wb ? a : b);
  return `
  <section class="panel">
    <div class="panelhead">
      <h2 style="margin-bottom:0">Duel de la semaine</h2>
      <button class="linkbtn" id="shareDuelBtn">📤 Partager</button>
    </div>
    <div class="vsrow">
      <div class="vsname">${esc(a.emoji)} ${esc(a.name)}</div>
      <div class="vs" style="flex:1;text-align:center">VS</div>
      <div class="vsname r">${esc(b.name)} ${esc(b.emoji)}</div>
    </div>
    <div class="duelbar"><span class="a" style="width:${pa}%;background:${esc(a.color)}"></span><span class="b" style="width:${100 - pa}%;background:${esc(b.color)}"></span></div>
    <div class="winbadge">${lead ? "👑 " + esc(lead.name) + " domine le donjon cette semaine" : "⚡ Égalité — tout se joue maintenant"}</div>
  </section>
  ${betSection()}
  <section class="panel">
    <div class="panelhead">
      <h2 style="margin-bottom:0">XP par semaine</h2>
      <button class="linkbtn" id="chartViewToggle" aria-pressed="${chartView === "table"}">${chartView === "chart" ? "Voir en tableau" : "Voir en graphique"}</button>
    </div>
    ${chartView === "chart" ? weekChart() : weekTable(a, b, weekChartData().data)}
  </section>
  <section class="panel">
    <div class="panelhead">
      <h2 style="margin-bottom:0">Calendrier d'activité <small>— 8 dernières semaines, à deux</small></h2>
      <button class="linkbtn" id="calViewToggle" aria-pressed="${calView === "table"}">${calView === "cal" ? "Voir en tableau" : "Voir en calendrier"}</button>
    </div>
    ${calView === "cal" ? activityCalendar(activityDays()) : activityTable(activityDays())}
  </section>
  <section class="panel">
    <h2>Statistiques</h2>
    <div class="statgrid">
      ${rows.map(([l, va, vb, u]) => `<span class="l">${va}${u}</span><span class="c">${l}</span><span class="r2">${vb}${u}</span>`).join("")}
    </div>
    <p class="hint" style="margin-top:8px">🛡️ Un bouclier s'active seul tous les 7 jours de série et comble automatiquement un jour manqué le lendemain matin — la série continue.</p>
  </section>
  <section class="panel">
    <div class="panelhead">
      <h2 style="margin-bottom:0">Mur des trophées</h2>
      <button class="linkbtn" id="shareTrophyBtn">📤 Partager</button>
    </div>
    ${trophyWall(trophies.byWeek)}
  </section>
  <section class="panel">
    <h2>Répartition des tâches</h2>
    ${taskSplit()}
  </section>
  <section class="panel">
    <h2>Hauts faits</h2>
    ${featSection()}
  </section>`;
}

/* ---------- Héros ---------- */
let herosView = "p1"; // dont on parcourt la collection (session seulement)
let herosUniverse = "all"; // filtre d'univers de la collection (session seulement)

function vHeros() {
  const p = S.players.find(x => x.id === herosView) || S.players[0];
  const st = charStats(p.id);
  const unlocked = new Set(unlockedCharIds(p.id));
  const cur = charOf(p);
  const nxt = nextHeroFor(p.id, herosUniverse !== "all" ? herosUniverse : null);

  const switcher = `
  <div class="filterrow" style="margin-bottom:12px">
    ${S.players.map(pl => `<button class="filterbtn ${herosView === pl.id ? "on" : ""}" aria-pressed="${herosView === pl.id}" data-hv="${pl.id}">${esc(pl.emoji)} ${esc(pl.name)}</button>`).join("")}
  </div>`;

  let curHtml;
  if (cur) {
    const tier = gearTier(cur, st);
    const conds = gearConds(cur);
    const next = tier < 3 ? conds[tier] : null;
    curHtml = `
    <div class="curchar" style="--rcol:${RARITIES[cur.rarity].col}">
      <span class="curchar-emoji">${cur.emoji}</span>
      <div class="grow">
        <div class="curchar-name">${esc(cur.name)} <span class="rarity" style="--rcol:${RARITIES[cur.rarity].col}">${cur.rarity}</span></div>
        <div class="hint">${esc(cur.univers)}</div>
        <div class="gearline">
          ${cur.gear.map((g, i) => `<span class="gearstep ${i < tier ? "on" : ""}">${i < tier ? "⭐" : "☆"} ${esc(g)}</span>`).join("")}
        </div>
        ${next ? `<div class="hint">Prochain palier : ${condText(next)}</div>` : `<div class="hint" style="color:var(--gold)">Équipement complet ! 🏅</div>`}
      </div>
    </div>`;
  } else {
    curHtml = `<p class="hint">${esc(p.name)} n'incarne encore aucun héros — débloquez-en un ci-dessous et touchez « Incarner ».</p>`;
  }

  const groups = UNIVERSES.filter(u => herosUniverse === "all" || u === herosUniverse).map(u => {
    const all = CHARACTERS.filter(c => c.univers === u);
    const nOk = all.filter(c => unlocked.has(c.id)).length;
    const cards = all.map(c => {
      const isUnlocked = unlocked.has(c.id);
      const isCur = cur && cur.id === c.id;
      const tier = isUnlocked ? gearTier(c, st) : 0;
      return `
      <div class="charcard ${isUnlocked ? "" : "locked"} ${isCur ? "current" : ""}" style="--rcol:${RARITIES[c.rarity].col}">
        <div class="charcard-top">
          <span class="charcard-emoji">${c.emoji}</span>
          <span class="rarity" style="--rcol:${RARITIES[c.rarity].col}">${c.rarity}</span>
        </div>
        <div class="charcard-name">${esc(c.name)}</div>
        ${isUnlocked
          ? `<div class="hint">${"⭐".repeat(tier)}${"☆".repeat(3 - tier)}</div>
             ${isCur ? '<div class="charcard-cur">Incarné ✓</div>' : `<button class="btn charcard-btn" data-equip="${c.id}">Incarner</button>`}`
          : `<div class="charcard-cond">🔒 ${condProgress(c.cond, st)}</div>`}
      </div>`;
    }).join("");
    return `<div class="day-h">${esc(u)} <span class="uvcount">${nOk}/${all.length}</span></div><div class="chargrid">${cards}</div>`;
  }).join("");

  const universeFilter = `
  <div class="filterrow" style="margin:8px 0 10px">
    <button class="filterbtn ${herosUniverse === "all" ? "on" : ""}" aria-pressed="${herosUniverse === "all"}" data-hu="all">Tous</button>
    ${UNIVERSES.map(u => `<button class="filterbtn ${herosUniverse === u ? "on" : ""}" aria-pressed="${herosUniverse === u}" data-hu="${esc(u)}">${esc(u)}</button>`).join("")}
  </div>`;

  return `
  ${switcher}
  <section class="panel">
    <div class="panelhead">
      <h2 style="margin-bottom:0">Héros incarné <small>— ${esc(p.name)}</small></h2>
      ${cur ? '<button class="linkbtn" id="shareHeroBtn">📤 Partager</button>' : ""}
    </div>
    ${curHtml}
    ${cur ? `<button class="undo" style="margin-top:10px" id="unequipBtn">Reprendre son emoji personnel</button>` : ""}
  </section>
  ${nxt ? `
  <section class="panel">
    <h2>Prochaine recrue</h2>
    <div class="curchar" style="--rcol:${RARITIES[nxt.rarity].col}">
      <span class="curchar-emoji">${nxt.emoji}</span>
      <div class="grow">
        <div class="curchar-name">${esc(nxt.name)} <span class="rarity" style="--rcol:${RARITIES[nxt.rarity].col}">${nxt.rarity}</span></div>
        <div class="hint">${esc(nxt.univers)}</div>
        <div class="charcard-cond" style="margin-top:4px">${condProgress(nxt.cond, st)}</div>
      </div>
    </div>
  </section>` : ""}
  <section class="panel">
    <h2>Collection <small>— ${unlocked.size}/${CHARACTERS.length} débloqués</small></h2>
    <p class="hint">Plus un héros est légendaire, plus il se mérite : niveaux, quêtes, séries et trophées. Son équipement progresse ensuite avec vous. Chaque héros est représenté par son emblème.</p>
    ${universeFilter}
    ${groups}
  </section>`;
}

/* ---------- Objectifs ---------- */
function vObjectifs() {
  const active = S.objectives.filter(o => !o.claimed);
  const objRows = active.map(o => {
    const prog = objProgress(o), pct = Math.min(100, Math.round(100 * prog / o.target));
    const rw = o.rewardId === "__random__"
      ? { icon: "🎲", name: "Récompense surprise (tirage au sort)" }
      : S.rewards.find(r => r.id === o.rewardId);
    const done = prog >= o.target;
    return `
    <div class="obj ${done ? "done" : ""}">
      ${done
        ? `<div class="oname">✅ ${esc(o.name)}</div>`
        : `<div class="frow" style="margin-bottom:6px">
             <input type="text" data-oname="${o.id}" value="${esc(o.name)}" maxlength="60" class="grow" style="min-width:0" aria-label="Nom du défi">
             <input type="number" data-otarget="${o.id}" value="${o.target}" min="1" inputmode="numeric" style="flex:0 0 78px" aria-label="Cible">
           </div>`}
      <div class="oreward">🎁 ${rw ? esc(rw.icon + " " + rw.name) : "Récompense au choix"}</div>
      <div class="obar"><i style="width:${pct}%"></i></div>
      <div class="onums">
        <span>${prog} / ${o.target} ${o.type === "xp" ? "XP (à deux)" : "quêtes (à deux)"}</span>
        <span>${pct}%</span>
      </div>
      ${done
        ? `<button class="claim" data-claim="${o.id}">Réclamer la récompense</button>`
        : `<button class="undo" style="margin-top:9px" data-delobj="${o.id}">Abandonner</button>`}
    </div>`;
  }).join("");

  const wonRows = S.won.slice().reverse().map(w =>
    `<div class="wonline"><span>${esc(w.icon)} ${esc(w.name)}</span><span class="d">${new Date(w.ts).toLocaleDateString("fr-FR")} <button class="notebtn" data-delwon="${w.id}" aria-label="Retirer de l'historique">✕</button></span></div>`
  ).join("");

  return `
  <section class="panel">
    <h2>Objectifs communs</h2>
    ${objRows || '<p class="hint">Aucun objectif actif. Lancez-vous un défi ci-dessous !</p>'}
  </section>
  <section class="panel">
    <h2>Nouveau défi</h2>
    <div class="filterrow" style="margin-bottom:8px">
      <button class="filterbtn" data-objpreset="sprint">⚡ Sprint 300 XP</button>
      <button class="filterbtn" data-objpreset="quetes20">🗡️ 20 quêtes</button>
      <button class="filterbtn" data-objpreset="grand">🏰 Grand ménage</button>
    </div>
    <div class="frow"><input type="text" id="objName" placeholder="Nom du défi (ex : Opération appart nickel)" maxlength="60" aria-label="Nom du défi"></div>
    <div class="frow">
      <select id="objType" aria-label="Type d'objectif">
        <option value="xp">XP cumulés à deux</option>
        <option value="count">Nombre de quêtes à deux</option>
      </select>
      <input type="number" id="objTarget" placeholder="Cible (ex : 300)" min="1" inputmode="numeric" aria-label="Cible du défi">
    </div>
    <div class="frow">
      <select id="objReward" aria-label="Récompense">
        ${S.rewards.map(r => `<option value="${r.id}">${esc(r.icon)} ${esc(r.name)}</option>`).join("")}
        <option value="__random__">🎲 Surprise (tirage au sort)</option>
      </select>
      <button class="btn" id="objAdd">Lancer le défi</button>
    </div>
    <p class="hint">Le compteur démarre à la création du défi : chaque quête accomplie par l'un de vous deux le fait avancer.${duoWeeklyPace() ? ` Votre rythme actuel : <b>~${duoWeeklyPace()} XP par semaine</b> à deux — de quoi calibrer la cible.` : ""}</p>
  </section>
  <section class="panel">
    <h2>Idées de récompenses</h2>
    ${S.rewards.map(r => `<div class="mgline">
      <input type="text" data-rwicon="${r.id}" value="${esc(r.icon)}" maxlength="4" style="flex:0 0 44px" aria-label="Icône de la récompense">
      <input type="text" data-rwname="${r.id}" value="${esc(r.name)}" maxlength="50" class="grow" style="min-width:0" aria-label="Nom de la récompense">
      <button class="x" data-delrw="${r.id}" aria-label="Supprimer">✕</button>
    </div>`).join("")}
    <div class="frow" style="margin-top:10px">
      <input type="text" id="rwIcon" placeholder="🎁" maxlength="4" style="flex:0 0 64px" aria-label="Icône de la récompense">
      <input type="text" id="rwName" placeholder="Nouvelle récompense (ex : Week-end surprise)" maxlength="50" aria-label="Nom de la récompense">
      <button class="btn" id="rwAdd" style="flex:0 0 auto">+</button>
    </div>
  </section>
  ${wonRows ? `<section class="panel"><h2>Récompenses gagnées 🏅</h2>${wonRows}</section>` : ""}`;
}

/* ---------- Journal ---------- */
let journalFilter = { q: "", player: "all" }; // session seulement, pas persisté
let journalEditing = null; // id de l'entrée dont la note est en cours d'édition, session seulement

function vJournal() {
  if (!S.log.length) return `<section class="panel"><h2>Journal de chasse</h2><p class="hint">Rien pour l'instant — la première quête vous attend.</p></section>`;

  const q = journalFilter.q.trim().toLowerCase();
  const filtered = S.log.filter(l => {
    if (journalFilter.player !== "all" && l.playerId !== journalFilter.player) return false;
    if (q && !l.taskName.toLowerCase().includes(q) && !(l.note || "").toLowerCase().includes(q)) return false;
    return true;
  });

  const filterBar = `
  <div class="frow" style="margin-bottom:9px;position:relative">
    <input type="text" id="journalSearch" placeholder="Rechercher une tâche…" value="${esc(journalFilter.q)}" aria-label="Rechercher dans le journal" style="${journalFilter.q ? "padding-right:34px" : ""}">
    ${journalFilter.q ? `<button class="x" id="journalSearchClear" aria-label="Effacer la recherche" style="position:absolute;right:6px;top:50%;transform:translateY(-50%)">✕</button>` : ""}
  </div>
  <div class="filterrow">
    <button class="filterbtn ${journalFilter.player === "all" ? "on" : ""}" aria-pressed="${journalFilter.player === "all"}" data-jf="all">Tous</button>
    ${S.players.map(p => `<button class="filterbtn ${journalFilter.player === p.id ? "on" : ""}" aria-pressed="${journalFilter.player === p.id}" data-jf="${p.id}">${esc(p.emoji)} ${esc(p.name)}</button>`).join("")}
  </div>`;

  if (!filtered.length) {
    return `<section class="panel"><h2>Journal de chasse</h2>${filterBar}<p class="hint" style="margin-top:10px">Aucune entrée ne correspond à ce filtre.</p></section>`;
  }

  const byDay = {};
  for (const l of filtered.slice().reverse()) (byDay[dayKey(l.ts)] ??= []).push(l);
  const days = Object.keys(byDay).map(k => {
    const label = new Date(k + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    return `<div class="day-h">${label}</div>` + byDay[k].map(l => {
      const p = S.players.find(x => x.id === l.playerId);
      const editable = l.note !== "bouclier";
      const noteZone = journalEditing === l.id
        ? `<input type="text" class="jnote-edit" data-noteedit="${l.id}" value="${esc(l.note)}" maxlength="40" placeholder="Note…" aria-label="Note sur cette entrée">`
        : `${l.note && editable ? ` <span class="chip gold">${esc(l.note)}</span>` : ""}${editable ? `<button class="notebtn" data-noteeditopen="${l.id}" aria-label="Ajouter ou modifier une note">✏️</button>` : ""}`;
      return `<div class="logline">
        <span>${esc(l.icon || "✅")}</span>
        <span class="lname">${p ? esc(p.emoji + " ") : ""}${esc(l.taskName)}</span>
        ${noteZone}
        <span class="lxp">+${l.xp} XP</span>
        <button class="undo" data-undo="${l.id}">Annuler</button>
      </div>`;
    }).join("");
  }).join("");
  return `<section class="panel"><h2>Journal de chasse</h2>${filterBar}${days}</section>`;
}

/* ================= Actions ================= */
function toast(msg, actionLabel, actionFn, ms) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  if (actionLabel && actionFn) {
    const b = document.createElement("button");
    b.className = "toast-action";
    b.textContent = actionLabel;
    b.onclick = () => { t.remove(); actionFn(); };
    t.appendChild(b);
  }
  $("#toastZone").appendChild(t);
  setTimeout(() => t.remove(), ms || (actionLabel ? 5000 : 2200));
}

// Une récompense encore promise par un défi ou un enjeu actif (non réclamé) ne doit pas
// pouvoir disparaître silencieusement : le défi/pari continuerait de tourner sur un
// rewardId fantôme, retombant sur un générique « Récompense au choix » à la réclamation,
// sans que personne ne s'en aperçoive avant ce moment-là.
function rewardInUse(id) {
  const o = S.objectives.find(x => !x.claimed && x.rewardId === id);
  if (o) return `le défi « ${o.name} »`;
  const b = S.bets.find(x => !x.claimed && x.rewardId === id);
  if (b) return "l'enjeu de la semaine en cours";
  return null;
}

// Le journal relie les quêtes par nom (taskName), pas par id : deux tâches
// homonymes se partageraient silencieusement le même historique (badge
// « dernier », suggestion équitable, répartition). Bloque la création/le
// renommage vers un nom déjà pris par une autre tâche.
function nameTaken(list, name, excludeId) {
  const n = name.trim().toLowerCase();
  return list.some(x => x.id !== excludeId && x.name.trim().toLowerCase() === n);
}

// Supprime un élément d'une collection (tâche, récompense, défi) avec un filet de
// rattrapage : un mistap n'oblige plus à tout retaper, comme pour le journal.
function deleteWithUndo(table, id, msg) {
  const idx = S[table].findIndex(x => x.id === id);
  if (idx < 0) return;
  const item = S[table][idx];
  S[table].splice(idx, 1);
  save(); queueOp({ table, type: "delete", id });
  render();
  toast(msg, "Annuler", () => {
    S[table].splice(Math.min(idx, S[table].length), 0, item);
    save(); queueOp({ table, type: "upsert", row: toRow[table](item) });
    render();
  });
}

}

/* ---------- Confettis (canvas, sobre, respecte le mouvement réduit) ---------- */
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confettiBurst() {
  if (REDUCE_MOTION) return;
  const canvas = document.createElement("canvas");
  canvas.id = "confetti";
  canvas.style.cssText = "position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%";
  document.body.appendChild(canvas);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.width = innerWidth * dpr, H = canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext("2d");
  const colors = ["#F0C550", "#4DC3FF", "#8B7BFF", "#5CE0A5", "#FF9D5C"];
  const N = 90;
  const parts = Array.from({ length: N }, () => ({
    x: W / 2 + (Math.random() - 0.5) * W * 0.3,
    y: H * 0.28,
    vx: (Math.random() - 0.5) * 9 * dpr,
    vy: (-Math.random() * 7 - 3) * dpr,
    g: 0.22 * dpr,
    size: (Math.random() * 5 + 3) * dpr,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.3,
    color: colors[Math.floor(Math.random() * colors.length)],
  }));
  const t0 = performance.now();
  function frame(t) {
    const dt = Math.min((t - t0) / 1000, 1.6);
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr;
      const fade = Math.max(0, 1 - dt / 1.6);
      if (fade <= 0 || p.y > H + 40) continue;
      alive = true;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

/* ---------- Carte partageable (canvas, aux couleurs du thème actif) ---------- */
function cardColors() {
  const cs = getComputedStyle(document.documentElement);
  const col = (name, fallback) => (cs.getPropertyValue(name).trim() || fallback);
  return {
    abyss: col("--abyss", "#060A13"), panel: col("--panel", "#0C1526"), line: col("--line", "#1C3252"),
    lineGlow: col("--line-glow", "#2B5A8F"),
    sys: col("--sys", "#4DC3FF"), gold: col("--gold", "#F0C550"), ink: col("--ink", "#D9E7F7"), inkDim: col("--ink-dim", "#8AA3C2"),
    mana: col("--mana", "#8B7BFF"), crit: col("--crit", "#FF5C6E"),
  };
}
// RARITIES.*.col est une référence CSS ("var(--x)") pour suivre les 5 thèmes à l'écran ;
// le canvas ne résout pas les variables CSS, il faut sa couleur déjà calculée.
function rarityCardColor(rarity, c) {
  const byRarity = { B: c.inkDim, A: c.sys, S: c.mana, SS: c.gold, GOD: c.crit };
  return byRarity[rarity] || c.inkDim;
}
function cardCanvas(W, H, c) {
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const bg = ctx.createRadialGradient(W / 2, 160, 60, W / 2, 160, 900);
  bg.addColorStop(0, "#101D33"); bg.addColorStop(1, c.abyss);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  return { canvas, ctx };
}
function cardHeader(ctx, W, c, subtitle) {
  ctx.fillStyle = c.sys;
  ctx.font = "700 28px system-ui, sans-serif";
  ctx.fillText("S Y S T È M E", W / 2, 130);
  ctx.fillStyle = c.ink;
  ctx.font = "900 64px system-ui, sans-serif";
  ctx.fillText("RANGEMENT", W / 2, 210);
  ctx.fillStyle = c.inkDim;
  ctx.font = "500 24px system-ui, sans-serif";
  ctx.fillText(subtitle, W / 2, 255);
}
function cardFooter(ctx, W, c, y) {
  ctx.fillStyle = c.inkDim;
  ctx.font = "500 22px system-ui, sans-serif";
  ctx.fillText(new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }), W / 2, y);
  ctx.fillStyle = c.sys;
  ctx.font = "700 24px system-ui, sans-serif";
  ctx.fillText("⚔️ rangement — ménage gamifié ⚔️", W / 2, y + 50);
}

function buildTrophyCard() {
  const [a, b] = S.players;

  const W = 1080, H = 1350;
  const { canvas, ctx } = cardCanvas(W, H, c);
  cardHeader(ctx, W, c, "Mur des trophées");

  function playerBlock(cx, p, lvl, rank, trophyCount) {
    ctx.fillStyle = panel;
    ctx.strokeStyle = rank.s ? gold : line;
    ctx.lineWidth = 3;
    const bx = cx - 220, by = 320, bw = 440, bh = 560, r = 20;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, r);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.color || sys;

    ctx.font = "500 26px system-ui, sans-serif";

    ctx.font = "700 34px system-ui, sans-serif";

function buildDuelCard() {
  const [a, b] = S.players;
  const wa = weekXp(a.id), wb = weekXp(b.id), tot = wa + wb;
  const pa = tot ? Math.round(100 * wa / tot) : 50;
  const lead = wa === wb ? null : (wa > wb ? a : b);
  const c = cardColors();
  const { panel, line, sys, gold, ink, inkDim } = c;

  const W = 1080, H = 1150;
  const { canvas, ctx } = cardCanvas(W, H, c);
  cardHeader(ctx, W, c, "Duel de la semaine");

  function playerBlock(cx, p, xp) {
    ctx.fillStyle = panel;
    ctx.strokeStyle = (lead && lead.id === p.id) ? gold : line;
    ctx.lineWidth = 3;
    const bx = cx - 220, by = 320, bw = 440, bh = 330, r = 20;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, r);
    ctx.fill(); ctx.stroke();
    if (lead && lead.id === p.id) {
      ctx.font = "56px system-ui, sans-serif";
      ctx.fillText("👑", cx, by - 20);
    }
    ctx.fillStyle = p.color || sys;
    ctx.font = "900 110px system-ui, sans-serif";
    ctx.fillText(p.emoji || "⚔️", cx, by + 140);
    ctx.fillStyle = ink;
    ctx.font = "700 40px system-ui, sans-serif";
    ctx.fillText(p.name, cx, by + 205);
    ctx.fillStyle = c.sys;
    ctx.font = "900 46px system-ui, sans-serif";
    ctx.fillText(xp + " XP", cx, by + 270);
    ctx.fillStyle = inkDim;
    ctx.font = "500 24px system-ui, sans-serif";
    ctx.fillText("cette semaine", cx, by + 305);
  }
  playerBlock(W / 2 - 250, a, wa);
  playerBlock(W / 2 + 250, b, wb);

  const barY = 730, barW = 700, barH = 26, barX = W / 2 - barW / 2;
  ctx.fillStyle = line;
  ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, barH / 2); ctx.fill();
  ctx.fillStyle = a.color || sys;
  ctx.beginPath(); ctx.roundRect(barX, barY, barW * pa / 100, barH, barH / 2); ctx.fill();
  ctx.fillStyle = b.color || sys;
  ctx.save(); ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, barH / 2); ctx.clip();
  ctx.fillRect(barX + barW * pa / 100, barY, barW * (100 - pa) / 100, barH);
  ctx.restore();

  ctx.fillStyle = gold;
  ctx.font = "700 34px system-ui, sans-serif";
  ctx.fillText(lead ? "👑 " + lead.name + " mène le duel" : "⚡ Égalité parfaite", W / 2, 810);

  cardFooter(ctx, W, c, 950);
  return canvas;
}

function shareCanvasCard(canvas, filenamePrefix, shareTitle, shareText) {
  canvas.toBlob(async blob => {
    if (!blob) { toast("Export impossible"); return; }
    const filename = filenamePrefix + "-" + dayKey(NOW()) + ".png";
    const file = (typeof File !== "undefined") ? new File([blob], filename, { type: "image/png" }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: shareTitle, text: shareText });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // partage annulé par l'utilisateur -> pas de repli
        /* partage indisponible -> repli téléchargement */
      }
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }, "image/png");
}
