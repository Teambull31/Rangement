// Piège le focus clavier dans la modale système affichée (Tab/Shift+Tab restent dans
// .sysbox), pose le focus initial sur le premier élément et mappe Échap sur l'action
// « Continuer » (jamais sur « Annuler » : Échap ne doit pas pouvoir annuler une quête).
function trapModal() {
  const box = $(".sysbox");
  if (!box) return;
  const focusable = () => Array.from(box.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.offsetParent !== null);
  const list = focusable();
  // Le focus initial doit toujours retomber sur l'action sûre (« Continuer »/« Garder nos
  // données »), jamais sur un bouton extra potentiellement destructeur (« Annuler », « Tout
  // effacer ») même s'il apparaît avant #veilOk dans le DOM — sans quoi un Entrée réflexe à
  // l'ouverture d'une modale pourrait valider l'action dangereuse.
  const safe = $("#veilOk") || $("#obNext");
  if (safe && list.includes(safe)) safe.focus();
  else if (list.length) list[0].focus();
  box.onkeydown = e => {
    if (e.key === "Escape") {
      e.preventDefault();
      const safe = $("#veilOk") || $("#obNext");
      if (safe) safe.click();
      return;
    }
    if (e.key !== "Tab") return;
    const items = focusable();
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
}

// Le focus clavier était piégé pendant l'ouverture (it. 25) mais jamais rendu à la
// fermeture : après une chaîne de modales, un utilisateur clavier retombait sur <body>
// et devait re-tabuler depuis le haut de la page. On mémorise l'élément d'origine une
// seule fois par chaîne (comme l'entrée d'historique juste en dessous), et on ne le
// restaure qu'une fois la chaîne réellement terminée (aucune nouvelle modale ouverte).
let PRE_MODAL_FOCUS = null;
function restoreModalFocus() {
  if (PRE_MODAL_FOCUS && document.body.contains(PRE_MODAL_FOCUS) && !document.querySelector(".veil")) {
    PRE_MODAL_FOCUS.focus();
  }
  if (!document.querySelector(".veil")) PRE_MODAL_FOCUS = null;
}
function sysModal(html, onClose, extra, okLabel) {
  // Le bouton retour (Android) doit fermer la modale, pas quitter l'appli :
  // une entrée d'historique est poussée à l'ouverture (une seule par chaîne de modales).
  if (!document.querySelector(".veil")) {
    try { history.pushState({ modal: true }, "", location.href); } catch (e) {}
    PRE_MODAL_FOCUS = document.activeElement;
  }
  // extra accepte un objet unique (compat historique) ou un tableau — un second bouton
  // additionnel au besoin (ex. « Incarner » + « Annuler » sur HÉROS DÉBLOQUÉ). Le premier
  // garde l'id historique #veilExtra (référencé par de nombreux tests existants).
  const extras = extra ? (Array.isArray(extra) ? extra : [extra]) : [];
  const extraId = i => "veilExtra" + (i === 0 ? "" : i);
  $("#modal").innerHTML = `
  <div class="veil" id="veil">
    <div class="sysbox" role="alertdialog" aria-modal="true">
      <div class="bang">Notification</div>
      ${html}
      <div class="frow" style="justify-content:center">
        ${extras.map((ex, i) => `<button class="btn ${ex.danger ? "danger" : ""}" id="${extraId(i)}">${ex.label}</button>`).join("")}
        <button class="btn ${extras.length ? "ghost" : ""}" id="veilOk">${okLabel || "Continuer"}</button>
      </div>
    </div>
  </div>`;
  $("#veilOk").onclick = () => { $("#modal").innerHTML = ""; if (onClose) onClose(); restoreModalFocus(); };
  extras.forEach((ex, i) => {
    $("#" + extraId(i)).onclick = () => { $("#modal").innerHTML = ""; ex.onclick(); restoreModalFocus(); };
  });
  labelModalBox();
  trapModal();
}

// Un lecteur d'écran qui n'annonce pas tout le contenu à l'ouverture d'un rôle
// alertdialog/dialog (comportement variable selon NVDA/VoiceOver) doit au moins
// pouvoir lire le titre et le texte de la modale via aria-labelledby/describedby —
// posés dynamiquement sur .big/.sub car leur contenu varie à chaque appel de sysModal.
function labelModalBox() {
  const box = $(".sysbox");
  if (!box) return;
  const big = box.querySelector(".big"), sub = box.querySelector(".sub");
  if (big) { if (!big.id) big.id = "sysModalTitle"; box.setAttribute("aria-labelledby", big.id); }
  if (sub) { if (!sub.id) sub.id = "sysModalDesc"; box.setAttribute("aria-describedby", sub.id); }
}

// Enchaîne plusieurs modales système à la suite (ex. niveau + objectif atteint sur la même
// quête) : chaque « Continuer » affiche la suivante. Un bouton « Annuler » interrompt la
// chaîne (la quête est annulée, les jalons suivants n'ont plus lieu d'être montrés).
function playMilestones(queue, i) {
  i = i || 0;
  if (i >= queue.length) return;
  const m = queue[i];
  chime(m.chime);
  const extras = m.extra ? (Array.isArray(m.extra) ? m.extra : [m.extra]) : null;
  sysModal(m.html, () => playMilestones(queue, i + 1),
    extras ? extras.map(ex => ({ label: ex.label, danger: ex.danger, onclick: () => {
      ex.onclick();
      if (!ex.stop) playMilestones(queue, i + 1);
    } })) : null);
}

function doTask(taskId, playerId) {
  const t = S.tasks.find(x => x.id === taskId);
  const p = S.players.find(x => x.id === playerId);
  if (!t || !p) return;
  const before = levelInfo(totalXp(playerId)).lvl;
  const objsBeforeIds = new Set(S.objectives.filter(o => !o.claimed && objProgress(o) >= o.target).map(o => o.id));
  const featsBefore = new Set(unlockedFeats(playerId).map(f => f.id));
  const charsBefore = new Set(unlockedCharIds(playerId));

  let xp = PRIOS[t.prio].xp;
  const notes = [];
  if (t.id === bonusTaskId()) { xp *= 2; notes.push("×2"); }
  const mult = streakMult(playerId);
  if (mult > 1) { xp = Math.round(xp * mult); notes.push("🔥+" + Math.round((mult - 1) * 100) + "%"); }

  const entry = { id: uid(), ts: NOW(), playerId, taskName: t.name, icon: t.icon, xp, note: notes.join(" ") };
  S.log.push(entry);
  save();
  queueOp({ table: "log", type: "upsert", row: toRow.log(entry) });
  try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}

  const after = levelInfo(totalXp(playerId)).lvl;
  const newObjs = S.objectives.filter(o => !o.claimed && objProgress(o) >= o.target && !objsBeforeIds.has(o.id));
  const newFeat = unlockedFeats(playerId).find(f => !featsBefore.has(f.id));
  const newChar = CHARACTERS.find(c => !charsBefore.has(c.id) && unlockedCharIds(playerId).includes(c.id));

  // Le focus clavier se perdait dans la chaîne de jalons : render() reconstruit le DOM et
  // détruit le bouton cliqué avant même l'ouverture de la première modale (sysModal capture
  // document.activeElement à ce moment-là, déjà retombé sur <body>). On retrouve le bouton
  // équivalent après le nouveau rendu via ses attributs data-do/data-p (pas par référence DOM,
  // l'ancien élément n'existe plus) et on le refocalise juste avant l'ouverture éventuelle
  // d'une modale, pour que sysModal capture le bon point de départ.
  const wasKeyboardFocused = document.activeElement && document.activeElement.matches &&
    document.activeElement.matches(`[data-do="${taskId}"][data-p="${playerId}"]`);
  render();
  if (wasKeyboardFocused) {
    const btn = $(`[data-do="${taskId}"][data-p="${playerId}"]`);
    if (btn) btn.focus();
  }

  // Annule la quête même après une modale spéciale (mistap sur le mauvais chasseur, etc.)
  const undoTask = () => {
    S.log = S.log.filter(l => l.id !== entry.id);
    save(); queueOp({ table: "log", type: "delete", id: entry.id });
    render(); toast("Action annulée");
  };

  // Plusieurs jalons peuvent tomber sur la même quête (ex. niveau + objectif atteint) :
  // ils s'enchaînent tous à la suite au lieu que les suivants soient silencieusement perdus.
  const queue = [];
  if (newChar) queue.push({
    chime: "level",
    html: `<div class="big gold">HÉROS DÉBLOQUÉ</div>
      <div class="sub"><span style="font-size:40px">${newChar.emoji}</span><br><b>${esc(newChar.name)}</b> (${esc(newChar.univers)}) rejoint la collection de <b>${esc(p.name)}</b> !</div>`,
    extra: [
      { label: "Incarner 🎴", onclick: () => equipChar(p, newChar) },
      { label: "Annuler", onclick: undoTask, stop: true },
    ],
  });
  if (after > before) {
    const rk = rankOf(after);
    queue.push({
      chime: "level",
      html: `<div class="big">NIVEAU ${after}</div>
        <div class="sub">${esc(p.emoji)} <b>${esc(p.name)}</b> monte en puissance !<br>Rang actuel : <b class="${rk.s ? "gold" : ""}">${rk.r}</b></div>`,
      extra: { label: "Annuler", onclick: undoTask, stop: true },
    });
  }
  newObjs.forEach(o => queue.push({
    chime: "level",
    html: `<div class="big gold">OBJECTIF ATTEINT</div>
      <div class="sub">Le défi <b>${esc(o.name)}</b> est terminé.<br>Allez le réclamer dans l'onglet <b>Objectifs</b> 🎁</div>`,
    extra: { label: "Annuler", onclick: undoTask, stop: true },
  }));
  if (newFeat) queue.push({
    chime: "feat",
    html: `<div class="big gold">HAUT FAIT</div>
      <div class="sub">${esc(p.emoji)} <b>${esc(p.name)}</b> débloque :<br><span style="font-size:26px">${newFeat.icon}</span><br><b>${esc(newFeat.name)}</b></div>`,
    extra: { label: "Annuler", onclick: undoTask, stop: true },
  });

  if (queue.length) playMilestones(queue);
  else toast(`${p.emoji} ${p.name} +${xp} XP`, "Annuler", undoTask);
}

  // Journal : recherche + filtre par joueur

  document.querySelectorAll("[data-undo]").forEach(b =>

  const noteInput = document.querySelector("[data-noteedit]");

    const o = { id: uid(), name, type: $("#objType").value, target, rewardId: $("#objReward").value, createdAt: NOW(), claimed: false };

  bindEnter(["#objName", "#objTarget"], objAdd);
  document.querySelectorAll("[data-oname]").forEach(inp =>

      render(); toast("Défis mis à jour");

        : S.rewards.find(r => r.id === o.rewardId)) || { name: "Récompense au choix", icon: "🎁" };
      o.claimed = true;
      const w = { id: uid(), name: rw.name, icon: rw.icon, ts: NOW() };
      S.won.push(w);
      save();
      queueOp({ table: "objectives", type: "upsert", row: toRow.objectives(o) });
      queueOp({ table: "won", type: "upsert", row: toRow.won(w) });
      render();
      confettiBurst();
      chime("level");
      // Un mistap sur « Réclamer » reste rattrapable, comme le reste de l'appli : Annuler
      // défait la récompense gagnée et redonne le défi à réclamer.
      const undoClaim = () => {
        o.claimed = false;
        S.won = S.won.filter(x => x.id !== w.id);
        save();
        queueOp({ table: "objectives", type: "upsert", row: toRow.objectives(o) });
        queueOp({ table: "won", type: "delete", id: w.id });
        render(); toast("Réclamation annulée");
      };
      sysModal(`
        <div class="big gold">RÉCOMPENSE</div>
        <div class="sub">${surprise ? "🎲 Le sort a désigné :" : "Vous avez gagné :"}<br><b>${esc(rw.icon)} ${esc(rw.name)}</b><br>Profitez-en bien, vous l'avez mérité 💙</div>`,
        null, { label: "Annuler", onclick: undoClaim });

  document.querySelectorAll("[data-delobj]").forEach(b =>

    b.onclick = () => deleteWithUndo("won", b.dataset.delwon, "Récompense retirée de l'historique"));

  // Pari de duel
  const betAdd = $("#betAdd");
  if (betAdd) betAdd.onclick = () => {
    const b = { id: uid(), week: weekKey(NOW()), rewardId: $("#betReward").value, createdAt: NOW(), claimed: false };
    (S.bets ??= []).push(b);
    save(); queueOp({ table: "bets", type: "upsert", row: toRow.bets(b) });
    render(); toast("Enjeu misé ⚔️");
  };
  document.querySelectorAll("[data-claimbet]").forEach(btn =>
    btn.onclick = () => {
      const b = S.bets.find(x => x.id === btn.dataset.claimbet);
      if (!b) return;
      const { byWeek } = trophyData();
      const x = byWeek[b.week] || { a: 0, b: 0 };
      const win = x.a === x.b ? null : (x.a > x.b ? S.players[0] : S.players[1]);
      const surprise = b.rewardId === "__random__";
      const rw = (surprise
        ? S.rewards[Math.floor(Math.random() * S.rewards.length)]
        : S.rewards.find(r => r.id === b.rewardId)) || { icon: "🎁", name: "Récompense" };
      b.claimed = true;
      const w = { id: uid(), name: rw.name, icon: rw.icon, ts: NOW() };
      S.won.push(w);
      save();
      queueOp({ table: "bets", type: "upsert", row: toRow.bets(b) });
      queueOp({ table: "won", type: "upsert", row: toRow.won(w) });
      render();
      confettiBurst();
      chime("level");
      const undoClaimBet = () => {
        b.claimed = false;
        S.won = S.won.filter(x => x.id !== w.id);
        save();
        queueOp({ table: "bets", type: "upsert", row: toRow.bets(b) });
        queueOp({ table: "won", type: "delete", id: w.id });
        render(); toast("Réclamation annulée");
      };
      sysModal(`
        <div class="big gold">PARI REMPORTÉ</div>
        <div class="sub">👑 <b>${esc(win ? win.name : "?")}</b> gagne l'enjeu :<br><b>${esc(rw.icon)} ${esc(rw.name)}</b>${surprise ? "<br>🎲 désigné par le sort" : ""}</div>`,
        null, { label: "Annuler", onclick: undoClaimBet });
    });
  document.querySelectorAll("[data-tiebet]").forEach(btn =>
    btn.onclick = () => {
      const b = S.bets.find(x => x.id === btn.dataset.tiebet);
      if (!b) return;
      b.claimed = true;
      save(); queueOp({ table: "bets", type: "upsert", row: toRow.bets(b) });
      render(); toast("Enjeu retiré (égalité)");
    });
  const cancelBetBtn = $("[data-cancelbet]");
  if (cancelBetBtn) cancelBetBtn.onclick = () =>
    deleteWithUndo("bets", cancelBetBtn.dataset.cancelbet, "Enjeu annulé");

  if (rwAdd) rwAdd.onclick = () => {

    const r = { id: uid(), name, icon: $("#rwIcon").value.trim() || "🎁" };
    S.rewards.push(r);
    save(); queueOp({ table: "rewards", type: "upsert", row: toRow.rewards(r) });
    render(); toast("Récompense ajoutée");
  };
  bindEnter(["#rwName", "#rwIcon"], rwAdd);
  document.querySelectorAll("[data-delrw]").forEach(b =>
    b.onclick = () => {

  document.querySelectorAll("[data-rwname], [data-rwicon]").forEach(inp =>
    inp.onchange = () => {
      const id = inp.dataset.rwname || inp.dataset.rwicon;

      if (!r) return;
      const v = inp.value.trim();
      if (!v) { inp.value = isName ? r.name : r.icon; return; }
      if (isName) r.name = v; else r.icon = v;
      save(); queueOp({ table: "rewards", type: "upsert", row: toRow.rewards(r) });
      render(); toast("Récompenses mises à jour");
    });

  // Installation PWA
  const installBtn = $("#installBtn");
  if (installBtn) installBtn.onclick = async () => {

  document.querySelectorAll("[data-pname], [data-pemoji]").forEach(inp =>
    inp.onchange = () => {

      const v = inp.value.trim();
      if (!v) { inp.value = isName ? p.name : p.emoji; return; }

      render(); toast("Chasseurs mis à jour");

  document.querySelectorAll("[data-pcolor]").forEach(inp =>

  const tAdd = $("#tAdd");
  if (tAdd) tAdd.onclick = () => {
    const name = $("#tName").value.trim();
    if (!name) return;
    if (nameTaken(S.tasks, name)) { toast("Une quête porte déjà ce nom"); return; }
    const t = { id: uid(), name, icon: $("#tIcon").value.trim() || "🧼", prio: $("#tPrio").value, createdAt: NOW() };
    S.tasks.push(t);
    save(); queueOp({ table: "tasks", type: "upsert", row: toRow.tasks(t) });
    render(); toast("Quête ajoutée");
  };
  bindEnter(["#tName", "#tIcon"], tAdd);
  document.querySelectorAll("[data-deltask]").forEach(b =>
    b.onclick = () => deleteWithUndo("tasks", b.dataset.deltask, "Quête supprimée"));
  document.querySelectorAll("[data-tprio]").forEach(sel =>
    sel.onchange = () => {
      const t = S.tasks.find(x => x.id === sel.dataset.tprio);
      if (t) {
        t.prio = sel.value;
        save(); queueOp({ table: "tasks", type: "upsert", row: toRow.tasks(t) });
        render(); toast("Quêtes mises à jour");
      }
    });
  document.querySelectorAll("[data-tname], [data-ticon]").forEach(inp =>
    inp.onchange = () => {
      const id = inp.dataset.tname || inp.dataset.ticon;
      const isName = !!inp.dataset.tname;
      const t = S.tasks.find(x => x.id === id);
      if (!t) return;
      const v = inp.value.trim();
      if (!v) { inp.value = isName ? t.name : t.icon; return; }
      if (isName) {
        if (v !== t.name && nameTaken(S.tasks, v, t.id)) { toast("Une quête porte déjà ce nom"); inp.value = t.name; return; }
        const oldName = t.name;
        t.name = v;
        if (oldName !== v) {
          S.log.filter(l => l.taskName === oldName).forEach(l => {
            l.taskName = v;
            queueOp({ table: "log", type: "upsert", row: toRow.log(l) });
          });
        }
      } else t.icon = v;
      save(); queueOp({ table: "tasks", type: "upsert", row: toRow.tasks(t) });
      render(); toast("Quêtes mises à jour");

  const soundToggle = $("#soundToggle");
  if (soundToggle) soundToggle.onchange = () => {

  const suggestToggle = $("#suggestToggle");
  if (suggestToggle) suggestToggle.onchange = () => {

  };

  if (streakHour) streakHour.onchange = () => {
    const raw = parseInt(streakHour.value, 10);
    if (Number.isFinite(raw)) localStorage.setItem("rangement-streak-hour", String(Math.min(23, Math.max(0, raw))));
    else localStorage.removeItem("rangement-streak-hour"); // champ vidé -> suit l'heure générique
    render();
  };
  const recapToggle = $("#recapToggle");
  if (recapToggle) recapToggle.onchange = () => {
    localStorage.setItem("rangement-recap", recapToggle.checked ? "on" : "off");
  };

  if (notifToggle) notifToggle.onchange = async () => {

    const perm = await Notification.requestPermission();
    if (perm !== "granted") {
      toast("Permission refusée — activable dans les réglages du navigateur");
      notifToggle.checked = false;
      localStorage.setItem("rangement-notifs", "off");
      return;

    localStorage.setItem("rangement-notifs", "on");
    toast("Notifications activées 🔔");

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rangement-sauvegarde-" + dayKey(NOW()) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);

  if (im) im.onclick = () => $("#importFile").click();
  const imf = $("#importFile");
  if (imf) imf.onchange = () => {
    const f = imf.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        const src = data.S || data; // accepte les sauvegardes v1 et v2
        if (!src.players || !src.log) throw new Error("format");
        // Import = remplacement total pour les deux téléphones, plus destructeur encore que
        // la remise à zéro (qui, elle, épargne tâches/récompenses) : même garde-fou en modale
        // système, action sûre par défaut (Échap/retour tombent sur « Annuler »).
        sysModal(`
          <div class="big" style="color:var(--crit)">IMPORTER UNE SAUVEGARDE</div>
          <div class="sub" style="text-align:left">Ce fichier contient <b>${(src.log || []).length} entrées de journal</b>. L'import remplacera <b>toutes les données actuelles pour vous deux</b> (journal, niveaux, héros incarnés, objectifs, paris, récompenses gagnées…).<br><br>Pensez à <b>Exporter</b> d'abord si vous voulez garder une trace de l'état actuel.</div>`,
          null,
          { label: "Importer quand même", danger: true, onclick: () => {
              S = Object.assign(defaultState(), src);
              TABLES.forEach(t => (S[t] || []).forEach(x => PENDING.push({ table: t, type: "upsert", row: toRow[t](x) })));
              save(); flushOps(); render(); toast("Sauvegarde importée ✅");
            } },
          "Annuler");
      } catch (e) { toast("Fichier invalide"); }
      imf.value = "";
    };
    r.readAsText(f);
  };
  // Remise à zéro : modale système cohérente avec le reste de l'appli (plus de confirm()
  // natif). Échap et le bouton retour tombent sur « Garder nos données » — jamais sur l'effacement.
  const rst = $("#resetBtn");
  if (rst) rst.onclick = () => {
    sysModal(`
      <div class="big" style="color:var(--crit)">REMISE À ZÉRO</div>
      <div class="sub" style="text-align:left">Journal, niveaux, objectifs, paris, récompenses gagnées et héros incarnés seront <b>effacés pour vous deux</b>.<br><br>Les tâches et idées de récompenses sont conservées. Pensez à <b>Exporter</b> d'abord si vous voulez une sauvegarde.</div>`,
      null,
      { label: "Tout effacer", danger: true, onclick: () => {
          S.log = []; S.won = []; S.objectives = []; S.bets = [];
          ["log", "won", "objectives", "bets"].forEach(t => queueOp({ table: t, type: "clear" }));
          S.players.forEach(p => {
            if (p.characterId) {
              p.characterId = null;
              const baseEmoji = localStorage.getItem(baseEmojiKey(p.id));
              if (baseEmoji) p.emoji = baseEmoji;
              queueOp({ table: "players", type: "upsert", row: toRow.players(p) });
            }
          });
          save(); render(); toast("L'aventure repart de zéro");
        } },
      "Garder nos données");
  };

  bindEnterCommit("[data-oname], [data-otarget], [data-pname], [data-pemoji], [data-tname], [data-ticon], [data-rwname], [data-rwicon], #eveningHour, #streakHour");
}

/* ---------- Thèmes (préférence propre à cet appareil) ---------- */
const THEMES = {
  systeme:  { label: "Système",  sys: "#4DC3FF", sysDim: "#2E7FB8", glow: "#2B5A8F", mana: "#8B7BFF" },
  monarque: { label: "Monarque", sys: "#8B7BFF", sysDim: "#5E50C4", glow: "#4A3F9E", mana: "#4DC3FF" },
  braise:   { label: "Braise",   sys: "#FF8A5C", sysDim: "#C05A32", glow: "#8F3A2B", mana: "#F0C550" },
  guilde:   { label: "Guilde",   sys: "#5CE0A5", sysDim: "#2FA372", glow: "#22684D", mana: "#4DC3FF" },
  aube:     { label: "Aube",     sys: "#0E7AC0", sysDim: "#0A5A8F", glow: "#9FC2E4", mana: "#6D5BD0",
              light: { abyss: "#EAF0F9", panel: "#FFFFFF", panel2: "#F4F8FE", line: "#C9D8EE", ink: "#16263F", inkDim: "#54688A", field: "#FFFFFF",
                       gold: "#9C7C0C", ok: "#1F8F5F", crit: "#CC3344", high: "#C2601A",
                       prioBasse: "#4A6483", prioNormale: "#1471B0",
                       navbg: "rgba(255,255,255,.92)", logoTop: "#33475F",
                       modalBg: "linear-gradient(180deg, #FFFFFF, #F4F8FE)", toastBg: "#FFFFFF" } },
};
function curTheme() {
  const stored = localStorage.getItem("rangement-theme");
  if (stored) return stored;
  // Jamais choisi : respecte la préférence système clair/sombre de l'appareil au premier lancement.
  const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  return prefersLight ? "aube" : "systeme";
}
function applyTheme(id) {
  const t = THEMES[id] || THEMES.systeme;
  const r = document.documentElement.style;
  r.setProperty("--sys", t.sys);
  r.setProperty("--sys-dim", t.sysDim);
  r.setProperty("--line-glow", t.glow);
  r.setProperty("--mana", t.mana);
  // Thème clair : bascule du fond, des panneaux et des encres (sinon retour aux défauts sombres)
  const L = t.light;
  const vars = { "--abyss": "abyss", "--panel": "panel", "--panel-2": "panel2", "--line": "line", "--ink": "ink", "--ink-dim": "inkDim", "--field": "field",
                 "--gold": "gold", "--ok": "ok", "--crit": "crit", "--high": "high", "--prio-basse": "prioBasse", "--prio-normale": "prioNormale",
                 "--navbg": "navbg", "--logo-top": "logoTop", "--modalbg": "modalBg", "--toastbg": "toastBg" };
  for (const [cssVar, key] of Object.entries(vars)) {
    if (L && L[key]) r.setProperty(cssVar, L[key]); else r.removeProperty(cssVar);
  }
  r.colorScheme = L ? "light" : "dark";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = L ? L.abyss : "#060A13";
  localStorage.setItem("rangement-theme", id);
}

/* ---------- Premier lancement : réveil du Système ---------- */
function onboarding() {
  if (localStorage.getItem("rangement-onboard-v1")) return;
  let step = 0;
  const stepHtml = () => {
    if (step === 0) return `
      <div class="big">RÉVEIL DU SYSTÈME</div>
      <div class="sub" style="text-align:left">Chaque tâche ménagère est une <b>quête</b> qui rapporte de l'<b>XP</b> selon sa priorité (10 à 50).<br><br>Vous montez de <b>niveau</b> et de <b>rang</b> (E → S → Monarque). Jouez chaque jour pour le bonus de série 🔥, et guettez la quête dorée ×2.</div>`;
    if (step === 1) return `
      <div class="big">VOS CHASSEURS</div>
      <div class="sub" style="text-align:left">Personnalisez vos profils (modifiables plus tard dans Réglages) :</div>
      ${S.players.map(p => `
      <div class="frow" style="margin-top:10px">
        <input type="text" data-ob-emoji="${p.id}" value="${esc(p.emoji)}" maxlength="4" style="flex:0 0 56px" aria-label="Emoji">
        <input type="text" data-ob-name="${p.id}" value="${esc(p.name)}" maxlength="20" aria-label="Nom">
        <input type="color" data-ob-color="${p.id}" value="${esc(p.color || "#4DC3FF")}" style="flex:0 0 46px;height:42px;padding:2px;background:var(--field);border:1px solid var(--line);border-radius:3px" aria-label="Couleur">
      </div>`).join("")}
      <p class="hint warn" id="obColorClash" style="display:none;margin-top:6px">⚠️ Les deux chasseurs ont la même couleur — le duel devient difficile à lire. Change l'une des deux.</p>`;
    return `
      <div class="big gold">LA CHASSE</div>
      <div class="sub" style="text-align:left">⚔️ Touchez <b>votre emoji</b> sur une quête accomplie.<br>👑 L'onglet <b>Duel</b> compare vos scores — un trophée par semaine gagnée.<br>🏆 Créez des <b>objectifs communs</b> : atteints, ils débloquent vos récompenses (ciné, resto, surprise 🎲…).<br><br>Que le meilleur chasseur gagne 💙</div>`;
  };
  const finish = () => {
    localStorage.setItem("rangement-onboard-v1", "1");
    $("#modal").innerHTML = "";
    render();
  };
  const show = () => {
    $("#modal").innerHTML = `
    <div class="veil">
      <div class="sysbox" role="dialog" aria-modal="true">
        <div class="bang">Notification</div>
        ${stepHtml()}
        <div class="frow" style="margin-top:16px">
          <button class="btn ghost" id="obSkip">Passer</button>
          <button class="btn" id="obNext">${step === 2 ? "Commencer la chasse" : "Suivant"}</button>
        </div>
      </div>
    </div>`;
    labelModalBox();
    trapModal();
    $("#obSkip").onclick = finish;
    $("#obNext").onclick = () => {
      if (step === 1) {
        S.players.forEach(p => {
          const n = document.querySelector(`[data-ob-name="${p.id}"]`).value.trim();
          const e = document.querySelector(`[data-ob-emoji="${p.id}"]`).value.trim();
          const c = document.querySelector(`[data-ob-color="${p.id}"]`).value;
          if (n) p.name = n;
          if (e) p.emoji = e;
          if (c) p.color = c;
          queueOp({ table: "players", type: "upsert", row: toRow.players(p) });
        });
        save(); render();
      }
      if (step === 2) return finish();
      step++; show();
    };
    if (step === 1) {
      const colorInputs = S.players.map(p => document.querySelector(`[data-ob-color="${p.id}"]`));
      const checkClash = () => {
        const hint = $("#obColorClash");
        if (!hint) return;
        hint.style.display = colorInputs[0] && colorInputs[1] && colorInputs[0].value.toLowerCase() === colorInputs[1].value.toLowerCase() ? "" : "none";
      };
      colorInputs.forEach(inp => inp && (inp.oninput = checkClash));
      checkClash();
    }
  };
  show();
}

/* ---------- Sons (synthétisés, pas de fichier externe) ---------- */
function soundsOn() { return localStorage.getItem("rangement-sound") !== "off"; }
let audioCtx = null;
function chime(kind) {
  if (!soundsOn()) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const notes = kind === "level" ? [523.25, 659.25, 783.99, 1046.5] : [659.25, 987.77];
    const t0 = audioCtx.currentTime;
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      const start = t0 + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.34);
    });
  } catch (e) { /* audio indisponible, tant pis */ }
}

/* ---------- Installation PWA ---------- */
let deferredInstallPrompt = null;
function isStandaloneApp() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
function isIOSDevice() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (TAB === "reglages") render();
});
window.addEventListener("appinstalled", () => { deferredInstallPrompt = null; if (TAB === "reglages") render(); });

applyTheme(curTheme());
render();
loadRemote();
flushOps();
onboarding();
if (!localStorage.getItem("rangement-onboard-v1")) {
  // premier lancement : l'onboarding prime sur le récap, pas de double fenêtre
} else if (shouldShowWeeklyRecap()) {
  weeklyRecapModal();
}
if (applyStreakShields()) render(); // repli mode local (sans Supabase) ou avant la première synchro
maybeSendStreakNotification();
LAST_REMIND_STATE = shouldShowEveningReminder(); // état de départ des rappels vivants
setInterval(reminderTick, 60000);

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        // "installed" avec un contrôleur déjà actif = nouvelle version en attente
        if (nw.state === "installed" && navigator.serviceWorker.controller) notifyUpdateAvailable();
      });
    });
  }).catch(() => {});
}
</script>
